<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, sans-serif; }
    #layout { display: flex; width: 100%; height: 100%; }
    #game-area { flex: 1; position: relative; min-width: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(255,255,255,0.95); z-index: 30; transition: opacity 0.2s;
    }
    #loading-overlay.hidden { display: none; }
    #loading-emoji { font-size: 80px; animation: wiggle 1.1s ease-in-out infinite; display: block; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-12deg) scale(1); }
      25%      { transform: rotate(12deg) scale(1.12); }
      50%      { transform: rotate(-6deg) scale(1); }
      75%      { transform: rotate(6deg) scale(1.06); }
    }
    #loading-text { font-size: 18px; font-weight: 600; color: #333; }
    #loading-sub  { font-size: 13px; color: #888; }
    #loading-dots { display: flex; gap: 10px; margin-top: 6px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; animation: dotJump 0.75s ease-in-out infinite; }
    .dot:nth-child(1) { background: #ff6b6b; animation-delay: 0s; }
    .dot:nth-child(2) { background: #ffd93d; animation-delay: 0.15s; }
    .dot:nth-child(3) { background: #6bcb77; animation-delay: 0.30s; }
    @keyframes dotJump { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-20px) scale(1.25); } }
    #speech-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 40px)); display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1.5px solid #ddd; border-radius: 32px;
      padding: 10px 10px 10px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); z-index: 20;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #speech-bar.hidden { display: none; }
    #speech-bar:focus-within { border-color: #4a9e6b; box-shadow: 0 4px 24px rgba(74,158,107,0.15); }
    #chat-input { flex: 1; border: none; outline: none; font-size: 15px; font-family: inherit; background: transparent; color: #222; min-width: 0; }
    #chat-input::placeholder { color: #aaa; }
    #chat-send { background: #4a9e6b; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s; line-height: 1; }
    #chat-send:hover { background: #3a8a5a; }
    #chat-send:disabled { background: #ccc; cursor: not-allowed; }
    #close-chat-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #bbb; flex-shrink: 0; line-height: 1; padding: 2px 4px; border-radius: 50%; }
    #close-chat-btn:hover { color: #888; background: #f0f0ec; }
    #toggle-btn {
      position: fixed; top: 50%; right: 270px; transform: translateY(-50%);
      width: 18px; height: 52px; background: #f0f0ec; border: 1px solid #ddddd8;
      border-left: none; border-radius: 0 6px 6px 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: right 0.25s ease, background 0.15s; color: #888; font-size: 10px; user-select: none;
    }
    #toggle-btn:hover { background: #e2e2de; color: #444; }
    #toggle-btn.panel-collapsed { right: 0; }
    #panel { width: 270px; height: 100%; background: #f7f7f5; border-left: 1px solid #e0e0dc; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.25s ease, opacity 0.25s ease; overflow: hidden; }
    #panel.collapsed { width: 0; opacity: 0; border-left: none; }
    #panel-inner { width: 270px; height: 100%; display: flex; flex-direction: column; }
    #env-strip-wrap { padding: 12px 0 0; background: #f7f7f5; border-bottom: 1px solid #e0e0dc; flex-shrink: 0; }
    #env-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scroll-behavior: smooth; scrollbar-width: none; }
    #env-strip::-webkit-scrollbar { display: none; }
    .env-btn { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid transparent; background: #fff; cursor: pointer; transition: all 0.15s ease; font-size: 11px; color: #666; font-weight: 500; }
    .env-btn .icon { font-size: 22px; }
    .env-btn:hover { background: #eee; }
    .env-btn.active { border-color: #4a9e6b; background: #edf7f1; color: #2e7d50; }
    #animals-area { flex: 1; overflow-y: auto; padding: 14px 12px; scrollbar-width: thin; scrollbar-color: #ddd transparent; }
    #env-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 10px; }
    #animals-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .animal-card { background: #fff; border: 1px solid #e4e4e0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px 8px; gap: 4px; cursor: grab; transition: all 0.12s ease; user-select: none; }
    .animal-card:hover { border-color: #4a9e6b; background: #f4fbf7; transform: scale(1.04); }
    .animal-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .animal-card .emoji { font-size: 26px; line-height: 1; pointer-events: none; }
    .animal-card .name  { font-size: 10px; color: #888; font-weight: 500; text-align: center; line-height: 1.2; pointer-events: none; }
    #drop-hint { position: absolute; inset: 0; pointer-events: none; z-index: 5; border: 3px dashed #4a9e6b; opacity: 0; transition: opacity 0.15s; background: rgba(74,158,107,0.04); display: flex; align-items: center; justify-content: center; }
    #drop-hint.active { opacity: 1; }
    #drop-hint span { font-size: 16px; color: #4a9e6b; font-weight: 600; background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 20px; }
  </style>
</head>
<body>
<div id="layout">
  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="drop-hint"><span>Drop animal here!</span></div>
    <div id="loading-overlay" class="hidden">
      <span id="loading-emoji"></span>
      <div id="loading-text"></div>
      <div id="loading-sub">Getting ready to chat!</div>
      <div id="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div id="speech-bar" class="hidden">
      <button id="close-chat-btn" title="Stop chatting">✕</button>
      <input id="chat-input" type="text" placeholder="Say something..." maxlength="200" />
      <button id="chat-send">&#x279C;</button>
    </div>
  </div>
  <button id="toggle-btn" title="Toggle panel">&#x276F;</button>
  <div id="panel">
    <div id="panel-inner">
      <div id="env-strip-wrap"><div id="env-strip"></div></div>
      <div id="animals-area">
        <div id="env-label"></div>
        <div id="animals-grid"></div>
      </div>
    </div>

</div>

const BAD_WORDS=['fuck','shit','bitch','ass','damn','crap','bastard','dick','cock','pussy','cunt','piss','hell','wtf','stfu','idiot','stupid','hate','kill','die','ugly'];
function hasBadWord(t){const l=t.toLowerCase();return BAD_WORDS.some(w=>new RegExp('\\b'+w+'\\b').test(l));}

// ── Move types — Flamingo/Chicken/Turkey/Rooster/Duck are WALKERS ──
const FLY_NAMES   = new Set(['Macaw','Butterfly','Snowy Owl','Snow Bunting','Dove','Crow','Bee','Vulture','Peacock','Swan']);
const SWIM_NAMES  = new Set(['Shark','Dolphin','Octopus','Whale','Clownfish','Squid','Blowfish','Tuna','Narwhal','Seal','Otter']);
const FLOOR_NAMES = new Set(['Crab','Lobster','Shrimp']);
const DRIFT_NAMES = new Set(['Jellyfish']);
const SWING_NAMES = new Set(['Monkey']);

function getMoveType(name){
  if(FLY_NAMES.has(name))return'fly';
  if(SWIM_NAMES.has(name))return'swim';
  if(FLOOR_NAMES.has(name))return'floor';
  if(DRIFT_NAMES.has(name))return'drift';
  if(SWING_NAMES.has(name))return'swing';
  return'walk';
}
function getActiveWorld(){return worlds.find(w=>w.id===activeWorldId)||null;}
function createWorld(envId,envLabel){const w={id:worldIdCounter++,envId,envLabel,animals:[]};worlds.push(w);activeWorldId=w.id;return w;}

function dk(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);
  return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ════════════════════════════════════════
// DRAW UTILITIES
// ════════════════════════════════════════
function wrapText(ctx,text,maxW){
  const words=text.split(' '),lines=[];let line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);return lines;
}
function drawRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function drawBubble(text,ax,ay,isUser){
  if(!text)return;
  const pad=14,lh=22,maxW=230,r=14;
  ctx.font='14px system-ui';
  const lines=wrapText(ctx,text,maxW);
  const bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+pad*2;
  const bh=lines.length*lh+pad*2;
  const emojiR=34;
  let bx=ax-bw/2,by=isUser?ay+emojiR+8:ay-emojiR-bh-8;
  bx=Math.max(8,Math.min(canvas.width-bw-8,bx));
  by=Math.max(8,Math.min(canvas.height-bh-8,by));
  const tailX=Math.max(bx+20,Math.min(bx+bw-20,ax));
  ctx.shadowColor='rgba(0,0,0,0.10)';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
  drawRoundRect(ctx,bx,by,bw,bh,r);
  ctx.fillStyle=isUser?'#4a9e6b':'#ffffff';ctx.fill();
  ctx.strokeStyle=isUser?'#3a8a5a':'#e0e0dc';ctx.lineWidth=1.5;ctx.stroke();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.beginPath();
  if(isUser){ctx.moveTo(tailX-8,by);ctx.lineTo(tailX,ay+emojiR+2);ctx.lineTo(tailX+8,by);}
  else{ctx.moveTo(tailX-8,by+bh);ctx.lineTo(tailX,ay-emojiR-2);ctx.lineTo(tailX+8,by+bh);}
  ctx.fillStyle=isUser?'#4a9e6b':'#ffffff';ctx.fill();
  ctx.font='14px system-ui';ctx.fillStyle=isUser?'#fff':'#222';ctx.textAlign='left';ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+pad+i*lh));
}

// ════════════════════════════════════════
// ANIMAL SHAPE DRAWING
// ════════════════════════════════════════
function dk(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);
  return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function legs(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

// ── CAT (tiger, lion, leopard, bobcat) ──
function drawCat(a,d){
  const p=a.phase,ls=Math.sin(p*3)*13;
  // curled tail
  ctx.strokeStyle=d.accent||dk(d.body,25);ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-28,-6);ctx.quadraticCurveTo(-40,-18,-36,-28);ctx.stroke();
  // legs
  ctx.strokeStyle=dk(d.body,25);ctx.lineWidth=5;
  [[20,10,ls],[20,10,-ls],[-18,10,-ls],[-18,10,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.5,ly+20));
  // sleek low body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,28,12,0,0,Math.PI*2);ctx.fill();
  // stripes
  if(d.stripes){ctx.strokeStyle=d.accent;ctx.lineWidth=3.5;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*9,-12);ctx.lineTo(i*9+4,12);ctx.stroke();}}
  // spots
  if(d.spots){ctx.fillStyle=d.accent;[[-12,-3],[5,-6],[15,2],[-3,6],[10,-1]].forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,3.5,0,Math.PI*2);ctx.fill();});}
  // big mane ring for lion
  if(d.mane){ctx.fillStyle=d.accent;ctx.beginPath();ctx.arc(26,-8,18,0,Math.PI*2);ctx.fill();}
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(26,-8,13,0,Math.PI*2);ctx.fill();
  // pointed ears
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(18,-20);ctx.lineTo(14,-32);ctx.lineTo(26,-22);ctx.fill();
  ctx.beginPath();ctx.moveTo(30,-20);ctx.lineTo(36,-32);ctx.lineTo(38,-21);ctx.fill();
  ctx.fillStyle='#e91e63';

// ── HORSE (horse, donkey, zebra) ──
function drawHorse(a,d){

// ── CROCODILE — long, flat, ridged ──

  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-8,0,44,10,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(36,-8);ctx.lineTo(72,-6);ctx.lineTo(72,8);ctx.lineTo(36,8);ctx.closePath();ctx.fill();

  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(32,-12,6,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(32,-12,2,3.5,0,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(-9,-22,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(9,-22,5,0,Math.PI*2);ctx.fill();

// ── BISON / WILDEBEEST / MUSK OX ──
function drawBison(a,d){
  const p=a.phase,ls=Math.sin(p*3)*8;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=7;ctx.lineCap='round';
  [[20,14,ls],[20,14,-ls],[-16,14,-ls],[-16,14,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.2,ly+18));
  // front-heavy body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-4,0,30,19,-.08,0,Math.PI*2);ctx.fill();
  // BIG hump over shoulders
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(6,-22,18,20,0,0,Math.PI*2);ctx.fill();
  // shaggy front mane
  ctx.fillStyle=d.accent;
  for(let i=0;i<9;i++){ctx.beginPath();ctx.arc(12-i*4,-8-i*2,8+i*.5,0,Math.PI*2);ctx.fill();}
  // big heavy head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(28,-8,20,16,.04,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(22,-10,14,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(28,-7,14,11,.04,0,Math.PI*2);ctx.fill();
  // curved horns
  ctx.strokeStyle='#5d4037';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(18,-22);ctx.quadraticCurveTo(6,-30,4,-20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,-22);ctx.quadraticCurveTo(42,-30,44,-20);ctx.stroke();
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(36,-12,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(37,-13,1.2,0,Math.PI*2);ctx.fill();
}

// ── WARTHOG ──
function drawWarthog(a,d){
  const p=a.phase,ls=Math.sin(p*3)*10;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=5;ctx.lineCap='round';
  [[16,10,ls],[16,10,-ls],[-14,10,-ls],[-14,10,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.3,ly+16));
  // tail straight up with tuft
  ctx.strokeStyle=dk(d.body,15);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-24,-2);ctx.lineTo(-26,-20);ctx.stroke();
  ctx.fillStyle=dk(d.body,22);ctx.beginPath();ctx.arc(-26,-22,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,22,14,0,0,Math.PI*2);ctx.fill();
  // large wide head with warts
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(28,2,20,16,.04,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.body,18);ctx.beginPath();ctx.arc(30,-6,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(36,-3,4,0,Math.PI*2);ctx.fill();
  // flat wide snout
  ctx.fillStyle=dk(d.body,12);ctx.beginPath();ctx.ellipse(44,4,11,8,.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.body,28);ctx.beginPath();ctx.ellipse(41,4,3,2.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(47,4,3,2.5,0,0,Math.PI*2);ctx.fill();
  // TUSKS — very distinctive warthog feature!
  ctx.strokeStyle=d.accent;ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(40,10);ctx.quadraticCurveTo(52,18,54,8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(36,12);ctx.quadraticCurveTo(48,22,50,12);ctx.stroke();
  // small ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(20,-14,5,9,-.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(30,-14,5,9,.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(34,-4,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(35,-5,1.2,0,Math.PI*2);ctx.fill();
}

// ── HEDGEHOG ──
function drawHedgehog(a,d){
  const p=a.phase,ls=Math.sin(p*4)*5;
  ctx.strokeStyle='#8B6914';ctx.lineWidth=3;ctx.lineCap='round';
  legs(10,10,10+ls,20);legs(-10,10,-10-ls,20);
  // spines on back
  for(let i=0;i<18;i++){
    const ang=(i/17)*Math.PI-Math.PI*.9;
    ctx.strokeStyle=d.accent;ctx.lineWidth=1.8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(Math.cos(ang)*14,Math.sin(ang)*11);ctx.lineTo(Math.cos(ang)*22,Math.sin(ang)*18-3);ctx.stroke();
  }
  // round body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,2,14,12,0,0,Math.PI*2);ctx.fill();
  // lighter pointed face
  ctx.fillStyle='#c49a6c';ctx.beginPath();ctx.ellipse(14,0,10,8,.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(18,-5);ctx.lineTo(26,-2);ctx.lineTo(18,5);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(18,-4,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(19,-5,1.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e91e63';ctx.beginPath();ctx.arc(25,-1,2.5,0,Math.PI*2);ctx.fill();
}

function drawRaccoon(a,d){

  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,20,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(12,-10);ctx.lineTo(15,-26);ctx.lineTo(5,-26);ctx.lineTo(2,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(14,-32,12,0,Math.PI*2);ctx.fill();

// ── BEAVER ──
function drawBeaver(a,d){

// ── OTTER ──
function drawOtter(a,d){

// ── Main dispatch ──
function drawAnimalShape(a,isActive){
  const d=AD[a.name]||{body:'#888',accent:'#666',shape:'bear'};
  ctx.save();ctx.translate(a.x,a.y);
  if(a.dir<0)ctx.scale(-1,1);
  if(isActive){ctx.shadowColor='rgba(74,158,107,0.75)';ctx.shadowBlur=22;}
  switch(d.shape){
    case'cat':      drawCat(a,d);break;
    case'horse':    drawHorse(a,d);break;
    case'bear':     drawBear(a,d);break;
    case'elephant': drawElephant(a,d);break;
    case'giraffe':  drawGiraffe(a,d);break;
    case'croc':     drawCroc(a,d);break;
    case'rhino':    drawRhino(a,d);break;
    case'hippo':    drawHippo(a,d);break;
    case'camel':    drawCamel(a,d);break;
    case'pig':      drawPig(a,d);break;
    case'rabbit':   drawRabbit(a,d);break;
    case'gorilla':  drawGorilla(a,d);break;
    case'deer':     drawDeer(a,d);break;
    case'wolf':     drawWolf(a,d);break;
    case'fox':      drawFox(a,d);break;
    case'frog':     drawFrog(a,d);break;
    case'sloth':    drawSloth(a,d);break;
    case'lizard':   drawLizard(a,d);break;
    case'cow':      drawCow(a,d);break;
    case'goat':     drawGoat(a,d);break;
    case'sheep':    drawSheep(a,d);break;
    case'llama':    drawLlama(a,d);break;
    case'meerkat':  drawMeerkat(a,d);break;
    case'bison':    drawBison(a,d);break;
    case'warthog':  drawWarthog(a,d);break;
    case'hedgehog': drawHedgehog(a,d);break;
    case'badger':   drawBadger(a,d);break;
    case'raccoon':  drawRaccoon(a,d);break;
    case'beaver':   drawBeaver(a,d);break;
    case'otter':    drawOtter(a,d);break;
    case'squirrel': drawSquirrel(a,d);break;
    case'fish':     drawFish(a,d);break;
    case'bird':     drawBird(a,d);break;
    case'bird_walk':drawBirdWalk(a,d);break;
    case'flamingo': drawFlamingo(a,d);break;
    case'penguin':  drawPenguin(a,d);break;
    case'monkey':   drawMonkeyShape(a,d);break;
    case'octopus':  drawOctopus(a,d);break;
    case'jellyfish':drawJellyfish(a,d);break;
    case'crab':     drawCrab(a,d);break;
    case'seal':     drawSeal(a,d);break;
    case'snake':    drawSnake(a,d);break;
    case'butterfly':drawButterfly(a,d);break;
    case'bee':      drawBee(a,d);break;
    case'insect':   drawInsect(a,d);break;
    case'spider':   drawSpider(a,d);break;
    case'squid':    drawSquid(a,d);break;
    case'shrimp':   drawShrimp(a,d);break;
    case'snail':    drawSnail(a,d);break;
    default:        drawBear(a,d);break;
  }
  ctx.restore();
  // name tag
  ctx.save();
  ctx.font='11px system-ui';ctx.textAlign='center';
  const nw=ctx.measureText(a.name).width;
  const tagY=a.y+50;
  if(isActive){
    drawRoundRect(ctx,a.x-nw/2-8,tagY,nw+16,17,8);
    ctx.fillStyle='rgba(74,158,107,0.9)';ctx.fill();
    ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(a.name,a.x,tagY+8);
  } else {
    ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.textBaseline='top';
    ctx.strokeText(a.name,a.x,tagY);ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillText(a.name,a.x,tagY);
  }
  ctx.restore();
  if(isActive){
    if(userSpeech)drawBubble(userSpeech,a.x,a.y,true);
    if(currentSpeech)drawBubble(currentSpeech,a.x,a.y,false);
  }
}

// ENVIRONMENT DRAWING
// ════════════════════════════════════════
function initSnow(w,h){
  if(snowflakes.length)return;
  for(let i=0;i<80;i++)snowflakes.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*3,spd:.4+Math.random()*.8,drift:(Math.random()-.5)*.4});
}
function updateSnow(w,h){
  snowflakes.forEach(s=>{s.y+=s.spd;s.x+=s.drift;if(s.y>h){s.y=-5;s.x=Math.random()*w;}if(s.x<0)s.x=w;if(s.x>w)s.x=0;});
}
function drawSnow(){
  ctx.fillStyle='rgba(255,255,255,0.85)';
  snowflakes.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
}

function initJungleTrees(w,h,gy){
  if(jungleTrees.length)return;
  const count=10;
  for(let i=0;i<count;i++){
    const xSeed=Math.sin(i*7.3+1)*0.5+0.5; // deterministic pseudo-random 0–1
    const tH=90+Math.floor(Math.sin(i*3.7)*1.5+1.5)*35; // 90–160
    const lR=42+Math.floor(Math.sin(i*2.1)*1.5+1.5)*16; // 42–90
    jungleTrees.push({
      x:50+xSeed*(w-100),
      trunkH:tH,
      branchY:gy-(tH*0.82),
      leafR:lR,
      // pre-compute vine anchor points
      vines:[
        {ox:-lR*.7, drop:gy-(tH*0.82)+lR*.3},
        {ox:lR*.5,  drop:gy-(tH*0.82)+lR*.5},
        {ox:-lR*.2, drop:gy-(tH*0.82)+lR*.65},
      ]
    });
  }
}

function drawJungleBackground(w,h,gy){
  // sky gradient
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#9fdc72');sg.addColorStop(1,'#5aaa28');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#3a7520');gg.addColorStop(1,'#1e4510');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);

  // trees first pass (behind vines)
  initJungleTrees(w,h,gy);
  const t2=Date.now()/1200;
  jungleTrees.forEach(t=>{
    // trunk
    ctx.fillStyle='#4e342e';
    ctx.fillRect(t.x-8,gy-t.trunkH,16,t.trunkH);
    // wide branch stubs
    ctx.strokeStyle='#3e2723';ctx.lineWidth=10;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x-t.leafR*.95,t.branchY+14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x+t.leafR*.95,t.branchY+14);ctx.stroke();
    ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(t.x-t.leafR*.5,t.branchY+8);ctx.lineTo(t.x-t.leafR*1.1,t.branchY+26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(t.x+t.leafR*.5,t.branchY+8);ctx.lineTo(t.x+t.leafR*1.1,t.branchY+26);ctx.stroke();
    ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x,t.branchY-18);ctx.stroke();
    // leaf canopy (layered)
    ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(t.x,t.branchY-t.leafR*.48,t.leafR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#388e3c';
    ctx.beginPath();ctx.ellipse(t.x-t.leafR*.8,t.branchY+10,t.leafR*.68,t.leafR*.42,-.28,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(t.x+t.leafR*.8,t.branchY+10,t.leafR*.68,t.leafR*.42,.28,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(t.x-t.leafR*1.05,t.branchY+22,t.leafR*.5,t.leafR*.32,-.18,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(t.x+t.leafR*1.05,t.branchY+22,t.leafR*.5,t.leafR*.32,.18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(t.x,t.branchY-t.leafR*.72,t.leafR*.55,0,Math.PI*2);ctx.fill();
    // bright highlight tuft
    ctx.fillStyle='rgba(100,200,60,0.22)';ctx.beginPath();ctx.arc(t.x-t.leafR*.15,t.branchY-t.leafR*.6,t.leafR*.35,0,Math.PI*2);ctx.fill();
  });

  // ── HANGING VINES from branch tips ──
  jungleTrees.forEach(t=>{
    t.vines.forEach((v,vi)=>{
      const swing=Math.sin(t2+vi*1.3+t.x*.01)*8;
      const startX=t.x+v.ox;
      const startY=t.branchY+6;
      const endY=v.drop;
      const tipX=startX+swing;
      // thick vine rope
      ctx.strokeStyle='#33691e';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(startX,startY);
      ctx.quadraticCurveTo(startX+swing*.4,(startY+endY)/2,tipX,endY);
      ctx.stroke();
      // small leaves along vine
      ctx.fillStyle='#558b2f';
      for(let lp=0.25;lp<=0.85;lp+=0.3){
        const lx=startX+(tipX-startX)*lp;
        const ly=startY+(endY-startY)*lp;
        const lsw=Math.sin(lp*Math.PI)*6;
        ctx.beginPath();ctx.ellipse(lx+lsw,ly,7,4,lp*1.5,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(lx-lsw,ly+3,6,3,-lp*1.5,0,Math.PI*2);ctx.fill();
      }
      // vine tip curl
      ctx.strokeStyle='#33691e';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(tipX,endY+4,4,-.8,Math.PI*.6);ctx.stroke();
    });
  });

  // background atmospheric vines (thick, visible)
  ctx.lineCap='round';
  const vineSeed=[.06,.18,.31,.47,.58,.71,.84,.93];
  vineSeed.forEach((frac,i)=>{
    const vx=w*frac;
    const swing2=Math.sin(t2*.7+i*0.9)*14;
    ctx.strokeStyle=`rgba(45,100,18,${0.45+i%3*0.12})`;ctx.lineWidth=5+i%2*2;
    ctx.beginPath();ctx.moveTo(vx,0);
    ctx.bezierCurveTo(vx+swing2,h*.18,vx-swing2*.8,h*.38,vx+swing2*.5,h*.62);
    ctx.stroke();
    // leaves on background vines
    ctx.fillStyle=`rgba(60,130,30,0.4)`;
    for(let lf=0.15;lf<=0.55;lf+=0.2){
      const lx=vx+swing2*(lf*2-0.5);const ly=h*lf;
      ctx.beginPath();ctx.ellipse(lx+8,ly,10,5,lf*2,0,Math.PI*2);ctx.fill();
    }
  });
}

function drawOceanBackground(w,h){
  // fully underwater — no sky/ground split
  const og=ctx.createLinearGradient(0,0,0,h);
  og.addColorStop(0,'#0288d1');og.addColorStop(.5,'#01579b');og.addColorStop(1,'#001f3d');
  ctx.fillStyle=og;ctx.fillRect(0,0,w,h);
  // light rays from surface
  ctx.globalAlpha=.06;ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){
    const rx=w*(.05+i*.13);
    ctx.beginPath();ctx.moveTo(rx-20,0);ctx.lineTo(rx+20,0);ctx.lineTo(rx+60,h*.5);ctx.lineTo(rx-40,h*.5);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
  // bubbles (static)
  ctx.fillStyle='rgba(255,255,255,0.2)';
  for(let i=0;i<30;i++){ctx.beginPath();ctx.arc((i*191+40)%w,(i*113+20)%(h*.7),1.5+(i%3),0,Math.PI*2);ctx.fill();}
  // seaweed
  for(let i=0;i<9;i++){
    const sx=40+i*(w-80)/8,sT=Date.now()/1000;
    ctx.strokeStyle='rgba(56,142,60,0.6)';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,h);
    for(let j=4;j>=0;j--){ctx.lineTo(sx+Math.sin(sT+i+j)*14,h-j*22);}
    ctx.stroke();
  }
  // sandy floor
  const sfg=ctx.createLinearGradient(0,h*.82,0,h);
  sfg.addColorStop(0,'#c8a86b');sfg.addColorStop(1,'#9a7848');
  ctx.fillStyle=sfg;ctx.beginPath();
  ctx.moveTo(0,h*.82);
  for(let x=0;x<=w;x+=30){ctx.lineTo(x,h*.82+Math.sin(x*.05)*8);}
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  // coral
  const corals=[{x:w*.1,c:'#e91e63'},{x:w*.3,c:'#ff5722'},{x:w*.55,c:'#9c27b0'},{x:w*.75,c:'#e91e63'},{x:w*.9,c:'#ff5722'}];
  corals.forEach(({x,c})=>{
    ctx.strokeStyle=c;ctx.lineWidth=4;ctx.lineCap='round';
    for(let b=0;b<5;b++){const bx=x-20+b*10;ctx.beginPath();ctx.moveTo(bx,h*.82);ctx.lineTo(bx+Math.sin(b)*8,h*.82-30-b*5);ctx.stroke();ctx.beginPath();ctx.arc(bx+Math.sin(b)*8,h*.82-32-b*5,5,0,Math.PI*2);ctx.fill();}
  });
}

function drawDesertBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#fde48c');sg.addColorStop(1,'#f5a430');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#e8c550');gg.addColorStop(1,'#b89020');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // sun
  ctx.save();
  ctx.shadowColor='rgba(255,200,0,0.6)';ctx.shadowBlur=40;
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(w*.82,gy*.22,52,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(w*.82,gy*.22,38,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // rolling dunes
  ctx.fillStyle='rgba(205,170,50,0.45)';
  ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,gy+30);
  ctx.bezierCurveTo(w*.15,gy-40,w*.28,gy-50,w*.4,gy+15);
  ctx.bezierCurveTo(w*.52,gy+55,w*.65,gy-30,w*.78,gy+10);
  ctx.bezierCurveTo(w*.9,gy+45,w,gy+20,w,gy+20);
  ctx.lineTo(w,h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(180,145,30,0.3)';
  ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,gy+60);
  ctx.bezierCurveTo(w*.2,gy+20,w*.38,gy-20,w*.5,gy+40);
  ctx.bezierCurveTo(w*.62,gy+70,w*.8,gy+5,w,gy+30);
  ctx.lineTo(w,h);ctx.closePath();ctx.fill();
  // cacti
  [[w*.1,gy],[w*.35,gy],[w*.6,gy],[w*.82,gy]].forEach(([cx,cy])=>drawCactus(cx,cy));
}

function drawCactus(cx,gy){
  ctx.fillStyle='#4caf50';
  ctx.fillRect(cx-8,gy-60,16,60);
  ctx.fillRect(cx-28,gy-40,20,10);
  ctx.fillRect(cx+8,gy-35,20,10);
  ctx.fillRect(cx-28,gy-55,8,16);
  ctx.fillRect(cx+20,gy-48,8,14);
  ctx.fillStyle='#388e3c';
  ctx.fillRect(cx-6,gy-60,4,60);
}

function drawArcticBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#e8f5ff');sg.addColorStop(1,'#aad8f8');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#cce8ff');gg.addColorStop(1,'#88b8dc');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // aurora suggestion
  ctx.globalAlpha=.12;
  for(let i=0;i<4;i++){
    const ag=ctx.createLinearGradient(0,0,0,gy*.6);
    ag.addColorStop(0,'rgba(0,255,150,0)');ag.addColorStop(.5,`rgba(${i%2?'0,200,255':'100,255,100'},0.6)`);ag.addColorStop(1,'rgba(0,255,150,0)');
    ctx.fillStyle=ag;ctx.fillRect(w*.1+i*(w*.22),0,w*.2,gy*.6);
  }
  ctx.globalAlpha=1;
  // jagged ice formations
  const iceGroups=[{x:w*.05,n:7,h:55},{x:w*.28,n:6,h:70},{x:w*.5,n:8,h:45},{x:w*.72,n:6,h:65},{x:w*.88,n:7,h:55}];
  iceGroups.forEach(({x,n,h:ih})=>{
    ctx.fillStyle='rgba(200,235,255,0.85)';
    ctx.beginPath();ctx.moveTo(x-n*8,gy);
    for(let i=0;i<=n;i++){const px=x-n*8+i*(n*16/n);ctx.lineTo(px+(i%2===0?4:-4),gy-(i%2===0?ih:ih*.5+Math.random()*10));}
    ctx.lineTo(x+n*8,gy);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(220,245,255,0.5)';
    ctx.beginPath();ctx.moveTo(x-n*6,gy);
    for(let i=0;i<=n-1;i++){const px=x-n*6+i*(n*12/(n-1));ctx.lineTo(px,gy-(i%2===0?ih*.6:ih*.2));}
    ctx.lineTo(x+n*6,gy);ctx.closePath();ctx.fill();
  });
  // horizontal ice lines
  ctx.strokeStyle='rgba(155,205,240,0.35)';ctx.lineWidth=1.5;
  [gy+12,gy+26].forEach(ly=>{ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(w,ly);ctx.stroke();});
  // snow
  initSnow(w,h);updateSnow(w,h);drawSnow();
}

function drawSavannaBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#fce07a');sg.addColorStop(1,'#e8901e');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#c8a030');gg.addColorStop(1,'#8c6818');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // grass tufts
  ctx.strokeStyle='rgba(155,120,18,0.35)';ctx.lineWidth=1.5;
  for(let i=0;i<38;i++){const gx=(i*137)%w;ctx.beginPath();ctx.moveTo(gx,gy+5);ctx.lineTo(gx-6,gy-20);ctx.moveTo(gx,gy+5);ctx.lineTo(gx+6,gy-22);ctx.moveTo(gx,gy+5);ctx.lineTo(gx,gy-15);ctx.stroke();}
  // acacia tree
  ctx.fillStyle='rgba(75,45,18,0.3)';ctx.fillRect(w*.85,gy-75,10,78);
  ctx.fillStyle='rgba(55,85,28,0.3)';ctx.beginPath();ctx.ellipse(w*.85+5,gy-75,50,16,0,0,Math.PI*2);ctx.fill();
}

function drawForestBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#b0d898');sg.addColorStop(1,'#609858');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#3a6828');gg.addColorStop(1,'#1e4015');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  for(let i=0;i<7;i++){const tx=25+i*(w/6.2),th=80+(i%3)*35,tw=14+(i%2)*4;ctx.fillStyle='rgba(55,35,15,0.22)';ctx.fillRect(tx-tw/2,gy-th,tw,th+8);ctx.fillStyle='rgba(35,75,28,0.27)';ctx.beginPath();ctx.arc(tx,gy-th,30+(i%2)*12,0,Math.PI*2);ctx.fill();}
}

function drawFarmBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#90d4f8');sg.addColorStop(1,'#5ab4ec');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#7acc40');gg.addColorStop(1,'#4aa020');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // barn in background
  ctx.fillStyle='rgba(180,50,30,0.25)';ctx.fillRect(w*.8,gy*.4,w*.15,gy*.55);
  ctx.fillStyle='rgba(120,30,20,0.2)';
  ctx.beginPath();ctx.moveTo(w*.78,gy*.4);ctx.lineTo(w*.875,gy*.22);ctx.lineTo(w*.97,gy*.4);ctx.closePath();ctx.fill();
  // pen fences (5 pens)
  const penW=w/5;
  ctx.strokeStyle='rgba(160,120,60,0.7)';ctx.lineWidth=3;
  // horizontal rails
  [gy+10,gy+26].forEach(ry=>{ctx.beginPath();ctx.moveTo(0,ry);ctx.lineTo(w,ry);ctx.stroke();});
  // vertical posts
  for(let i=0;i<=5;i++){const px=i*penW;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,gy-5);ctx.lineTo(px,gy+32);ctx.stroke();}
  // pen labels
  ctx.fillStyle='rgba(100,75,35,0.4)';ctx.font='10px system-ui';ctx.textAlign='center';
  for(let i=0;i<5;i++){ctx.fillText('Pen '+(i+1),(i+.5)*penW,gy+42);}
}

function drawFullBackground(world){
  const w=canvas.width,h=canvas.height,gy=h*.62;
  switch(world.envId){
    case'ocean':   drawOceanBackground(w,h);break;
    case'jungle':  drawJungleBackground(w,h,gy);break;
    case'desert':  drawDesertBackground(w,h,gy);break;
    case'arctic':  drawArcticBackground(w,h,gy);break;
    case'savanna': drawSavannaBackground(w,h,gy);break;
    case'forest':  drawForestBackground(w,h,gy);break;
    case'farm':    drawFarmBackground(w,h,gy);break;
    default:{
      const sg=ctx.createLinearGradient(0,0,0,gy);sg.addColorStop(0,'#b0d898');sg.addColorStop(1,'#609858');
      ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
      ctx.fillStyle='#3a6828';ctx.fillRect(0,gy,w,h-gy);
    }
  }
}

// MOVEMENT
// ════════════════════════════════════════
function updateAnimals(world){
  const cw=canvas.width,ch=canvas.height;
  const gy=ch*.62;
  const groundY=gy-30;
  const skyMin=ch*.08,skyMax=ch*.42;
  const waterMid=ch*.48,waterMin=ch*.3,waterMax=ch*.7;
  const floorY=ch*.83;
  const driftMin=ch*.15,driftMax=ch*.38;

  world.animals.forEach(a=>{
    if(a.chatting)return;
    a.phase+=0.025;
    a.x+=a.vx;

    // Pen boundaries for farm animals
    if(world.envId==='farm'){
      const penW=cw/5;
      const pIdx=(a.penIndex||0)%5;
      const penL=pIdx*penW+18,penR=penL+penW-36;
      if(a.x<penL){a.x=penL;a.vx=Math.abs(a.vx);a.dir=1;}
      if(a.x>penR){a.x=penR;a.vx=-Math.abs(a.vx);a.dir=-1;}
      a.y=groundY+Math.sin(a.phase*3)*4;
      return;
    }

    switch(a.moveType){
      case'fly':
        a.y=(skyMin+skyMax)/2+Math.sin(a.phase)*(skyMax-skyMin)*.38;
        break;
      case'swim':
        if(world.envId==='ocean'){a.y=waterMid+Math.sin(a.phase*.8)*90;}
        else{a.y=(ch*.65+ch*.87)/2+Math.sin(a.phase*.7)*26;}
        break;
      case'floor':
        a.y=floorY+Math.sin(a.phase*4)*4;
        break;
      case'drift':
        a.y=driftMin+(driftMax-driftMin)*.5+Math.sin(a.phase*.6)*(driftMax-driftMin)*.4;
        a.vx*=0.998; // gentle drift
        break;
      case'swing':
        // monkey swings between jungle tree branches
        if(world.envId==='jungle'){
          initJungleTrees(cw,ch,gy);
          if(!a.swingTarget||Math.abs(a.x-a.swingTarget.x)<30){
            const others=jungleTrees.filter(t=>t.x!==a.swingTarget?.x);
            a.swingTarget=others[Math.floor(Math.random()*others.length)]||jungleTrees[0];
            const dx=a.swingTarget.x-a.x;a.vx=Math.sign(dx)*(0.8+Math.random()*.5);a.dir=Math.sign(dx)||1;
          }
          a.y=(a.swingTarget?.branchY||gy-100)+Math.sin(a.phase*2)*12;
        } else {
          a.y=(skyMin+skyMax)/2+Math.sin(a.phase)*30;
        }
        break;
      default:
        a.y=groundY+Math.sin(a.phase*3)*5;
    }

    const margin=70;
    if(a.x<margin){a.x=margin;a.vx=Math.abs(a.vx);a.dir=1;}
    if(a.x>cw-margin){a.x=cw-margin;a.vx=-Math.abs(a.vx);a.dir=-1;}
  });
}

// WORLD TABS + MAIN DRAW
// ════════════════════════════════════════
function drawWorldTabs(){
  const ch=canvas.height;
  worlds.forEach((world,i)=>{
    const tx=TAB_MARGIN+i*(TAB_W+TAB_GAP),ty=ch-TAB_H-TAB_MARGIN;
    const isActive=world.id===activeWorldId;
    ctx.save();ctx.shadowColor='rgba(0,0,0,0.28)';ctx.shadowBlur=8;
    drawRoundRect(ctx,tx,ty,TAB_W,TAB_H,10);
    ctx.fillStyle=isActive?'rgba(74,158,107,0.94)':'rgba(0,0,0,0.52)';ctx.fill();
    ctx.shadowBlur=0;ctx.font='20px serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(ENV_ICONS[world.envId]||'🌍',tx+8,ty+TAB_H/2);
    ctx.font='10px system-ui';ctx.fillStyle='#fff';ctx.textAlign='left';
    const label=world.envLabel||'New Group';
    ctx.fillText(label.length>9?label.slice(0,9):label,tx+32,ty+TAB_H/2);
    ctx.restore();
  });
  const bx=TAB_MARGIN+worlds.length*(TAB_W+TAB_GAP),by=canvas.height-TAB_H-TAB_MARGIN;
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=6;
  drawRoundRect(ctx,bx,by,NEW_BTN_W,TAB_H,10);
  ctx.fillStyle=pendingNewWorld?'rgba(74,158,107,0.9)':'rgba(255,255,255,0.22)';ctx.fill();
  ctx.shadowBlur=0;ctx.font='bold 20px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('+',bx+NEW_BTN_W/2,by+TAB_H/2);ctx.restore();
}

function drawAnimals(){
  const world=getActiveWorld();
  if(!world){
    ctx.fillStyle='#f0ede6';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.font='bold 18px system-ui';ctx.fillStyle='#aaa';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Drag an animal to get started!',canvas.width/2,canvas.height/2-14);
    ctx.font='13px system-ui';ctx.fillStyle='#bbb';
    ctx.fillText('Each environment gets its own world',canvas.width/2,canvas.height/2+14);
    ctx.restore();drawWorldTabs();return;
  }
  if(world.envId){drawFullBackground(world);}
  else{ctx.fillStyle='#c8c4be';ctx.fillRect(0,0,canvas.width,canvas.height);}
  updateAnimals(world);
  world.animals.forEach(a=>drawAnimalShape(a,activeChatAnimal&&activeChatAnimal.id===a.id));
  drawWorldTabs();
}

function loop(){
  try{drawAnimals();}
  catch(e){
    // Never let a draw error kill the animation loop
    ctx.restore();// reset any dangling save
    console.warn('Draw error (recovered):',e);
  }
  requestAnimationFrame(loop);
}
loop();

// DRAG & DROP
// ════════════════════════════════════════
let dragPayload=null;
const dropHint=document.getElementById('drop-hint');
const gameArea=document.getElementById('game-area');

gameArea.addEventListener('dragover',e=>{e.preventDefault();dropHint.classList.add('active');});
gameArea.addEventListener('dragleave',e=>{if(!gameArea.contains(e.relatedTarget))dropHint.classList.remove('active');});
gameArea.addEventListener('drop',e=>{
  e.preventDefault();dropHint.classList.remove('active');
  if(!dragPayload)return;
  const rect=canvas.getBoundingClientRect();
  const dropX=(e.clientX-rect.left)*(canvas.width/rect.width);
  const cw=canvas.width,ch=canvas.height;

  let world=getActiveWorld();
  if(!world)world=createWorld(dragPayload.envId,dragPayload.envLabel);
  else if(world.envId===null){world.envId=dragPayload.envId;world.envLabel=dragPayload.envLabel;pendingNewWorld=null;}
  else if(world.envId!==dragPayload.envId){let ex=worlds.find(w=>w.envId===dragPayload.envId);if(ex){activeWorldId=ex.id;world=ex;}else world=createWorld(dragPayload.envId,dragPayload.envLabel);}

  let mt=getMoveType(dragPayload.name);
  // farm animals walk in pens, even flyers
  if(world.envId==='farm')mt='walk';

  const gy=ch*.62;
  let startY;
  if(mt==='fly')startY=ch*.22+Math.random()*ch*.18;
  else if(mt==='swim')startY=ch*.48+Math.random()*ch*.22;
  else if(mt==='floor')startY=ch*.83;
  else if(mt==='drift')startY=ch*.2+Math.random()*ch*.18;
  else startY=gy-30;

  const spd=0.7+Math.random()*1.3,dir=Math.random()<.5?1:-1;
  const farmAnimals=world.animals.filter(a=>a.envId==='farm').length;

  world.animals.push({
    id:animalIdCounter++,emoji:dragPayload.emoji,name:dragPayload.name,
    envId:dragPayload.envId,envLabel:dragPayload.envLabel,
    x:Math.max(80,Math.min(cw-80,dropX)),y:startY,
    vx:spd*dir,phase:Math.random()*Math.PI*2,
    moveType:mt,dir,chatting:false,
    penIndex:world.envId==='farm'?farmAnimals:0,
  });
  dragPayload=null;
});

// CLICK ANIMAL ON CANVAS
// ════════════════════════════════════════
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const ch=canvas.height,tabY=ch-TAB_H-TAB_MARGIN;
  if(my>=tabY){
    for(let i=0;i<worlds.length;i++){
      const tx=TAB_MARGIN+i*(TAB_W+TAB_GAP);
      if(mx>=tx&&mx<=tx+TAB_W){if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}activeWorldId=worlds[i].id;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');return;}
    }
    const bx=TAB_MARGIN+worlds.length*(TAB_W+TAB_GAP);
    if(mx>=bx&&mx<=bx+NEW_BTN_W){if(!pendingNewWorld){pendingNewWorld={id:worldIdCounter++,envId:null,envLabel:'New Group',animals:[]};worlds.push(pendingNewWorld);}if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}activeWorldId=pendingNewWorld.id;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');}
    return;
  }
  const world=getActiveWorld();if(!world)return;
  for(const a of world.animals){const dx=mx-a.x,dy=my-a.y;if(Math.sqrt(dx*dx+dy*dy)<42){openChat(a);return;}}
  if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');}
});

const loadingOverlay=document.getElementById('loading-overlay');
const loadingEmoji=document.getElementById('loading-emoji');
const loadingText=document.getElementById('loading-text');
const speechBar=document.getElementById('speech-bar');
const chatInput=document.getElementById('chat-input');
const chatSend=document.getElementById('chat-send');
const closeChatBtn=document.getElementById('close-chat-btn');
let conversations={},isSending=false;

function buildSystemPrompt(animal){
  return`You are ${animal.name}, a friendly and lovable ${animal.name} living in the ${animal.envLabel}. You love chatting with kids and families!

RULES — follow EVERY response, no exceptions:
- Stay fully in character as a real ${animal.name} — think, talk, and act like one
- Family-friendly only, suitable for ages 4+, 2-3 sentences max
- VERY IMPORTANT — REALISTIC ACTIONS: If the user asks you to do something a real ${animal.name} CANNOT do in real life, you MUST refuse in a playful way and suggest something you CAN do. Examples of impossible things by species: fish cannot climb trees or walk on land; chickens, turkeys, roosters, and flamingos cannot fly high (only hop or flutter); crabs cannot swim fast or climb; sharks cannot walk on land; penguins cannot fly. When refusing say something like "Ha! I'm a ${animal.name} — I can't do that! But I CAN [realistic thing a real ${animal.name} does]!"
- If anyone uses bad language, reply: "Oops! Let's keep things nice and friendly! 🌟"
- Be warm, playful, and encouraging at all times`;
}

async function openChat(animal){
  activeChatAnimal=animal;animal.chatting=true;
  loadingEmoji.textContent=animal.emoji;
  loadingText.textContent=`Waking up ${animal.name}...`;
  loadingOverlay.classList.remove('hidden');
  if(conversations[animal.id]){loadingOverlay.classList.add('hidden');showChatUI(animal);return;}
  conversations[animal.id]=[];currentSpeech='';userSpeech='';
  try{
    const greeting=await callAPI(animal,[{role:'user',content:`Hi! Say a fun greeting as ${animal.name}!`}]);
    conversations[animal.id].push({role:'user',content:`Hi! Say a fun greeting as ${animal.name}!`},{role:'assistant',content:greeting});
    currentSpeech=greeting;loadingOverlay.classList.add('hidden');showChatUI(animal);
  }catch(err){loadingOverlay.classList.add('hidden');alert('Could not connect. Please try again.');animal.chatting=false;activeChatAnimal=null;}
}

function showChatUI(animal){speechBar.classList.remove('hidden');chatInput.focus();}

async function sendMessage(){
  if(!activeChatAnimal||isSending)return;
  const text=chatInput.value.trim();if(!text)return;
  chatInput.value='';isSending=true;chatSend.disabled=true;
  userSpeech=hasBadWord(text)?'[message filtered]':text;
  const userContent=hasBadWord(text)?'[message filtered]':text;
  conversations[activeChatAnimal.id].push({role:'user',content:userContent});
  try{
    const reply=await callAPI(activeChatAnimal,conversations[activeChatAnimal.id]);
    conversations[activeChatAnimal.id].push({role:'assistant',content:reply});currentSpeech=reply;
  }catch(e){
    const fb="Oops, I lost my voice! Try again? 🐾";
    conversations[activeChatAnimal.id].push({role:'assistant',content:fb});currentSpeech=fb;
  }
  isSending=false;chatSend.disabled=false;chatInput.focus();
}

async function callAPI(animal,messages){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemPrompt:buildSystemPrompt(animal),messages})});
  if(!res.ok)throw new Error('API error '+res.status);
  const data=await res.json();return data.reply;
}

chatSend.addEventListener('click',sendMessage);
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
closeChatBtn.addEventListener('click',()=>{if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}currentSpeech='';userSpeech='';speechBar.classList.add('hidden');});

function selectEnv(id){
  activeEnv=id;
  document.querySelectorAll('.env-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  const env=environments.find(e=>e.id===id);
  document.getElementById('env-label').textContent=env.label+' Animals';
  const grid=document.getElementById('animals-grid');grid.innerHTML='';
  env.animals.forEach(animal=>{
    const card=document.createElement('div');card.className='animal-card';card.draggable=true;
    card.innerHTML=`<span class="emoji">${animal.emoji}</span><span class="name">${animal.name}</span>`;
    card.addEventListener('dragstart',e=>{
      dragPayload={emoji:animal.emoji,name:animal.name,envId:env.id,envLabel:env.label};
      card.classList.add('dragging');
      const dc=document.createElement('canvas');dc.width=90;dc.height=90;
      const dx=dc.getContext('2d');
      dx.beginPath();dx.arc(45,45,42,0,Math.PI*2);dx.fillStyle='#fff';dx.fill();
      dx.strokeStyle='#4a9e6b';dx.lineWidth=3;dx.stroke();
      dx.font='42px serif';dx.textAlign='center';dx.textBaseline='middle';
      dx.fillText(animal.emoji,45,45);
      e.dataTransfer.setDragImage(dc,45,45);
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    grid.appendChild(card);
  });
}
