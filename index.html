<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, sans-serif; }
    #layout { display: flex; width: 100%; height: 100%; }
    #game-area { flex: 1; position: relative; min-width: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(255,255,255,0.95); z-index: 30; transition: opacity 0.2s;
    }
    #loading-overlay.hidden { display: none; }
    #loading-emoji { font-size: 80px; animation: wiggle 1.1s ease-in-out infinite; display: block; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-12deg) scale(1); }
      25%      { transform: rotate(12deg) scale(1.12); }
      50%      { transform: rotate(-6deg) scale(1); }
      75%      { transform: rotate(6deg) scale(1.06); }
    }
    #loading-text { font-size: 18px; font-weight: 600; color: #333; }
    #loading-sub  { font-size: 13px; color: #888; }
    #loading-dots { display: flex; gap: 10px; margin-top: 6px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; animation: dotJump 0.75s ease-in-out infinite; }
    .dot:nth-child(1) { background: #ff6b6b; animation-delay: 0s; }
    .dot:nth-child(2) { background: #ffd93d; animation-delay: 0.15s; }
    .dot:nth-child(3) { background: #6bcb77; animation-delay: 0.30s; }
    @keyframes dotJump { 0%,100% { transform: translateY(0) scale(1); } 45% { transform: translateY(-20px) scale(1.25); } }
    #speech-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 40px)); display: flex; align-items: center; gap: 10px;
      background: #fff; border: 1.5px solid #ddd; border-radius: 32px;
      padding: 10px 10px 10px 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); z-index: 20;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #speech-bar.hidden { display: none; }
    #speech-bar:focus-within { border-color: #4a9e6b; box-shadow: 0 4px 24px rgba(74,158,107,0.15); }
    #chat-input { flex: 1; border: none; outline: none; font-size: 15px; font-family: inherit; background: transparent; color: #222; min-width: 0; }
    #chat-input::placeholder { color: #aaa; }
    #chat-send { background: #4a9e6b; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s; line-height: 1; }
    #chat-send:hover { background: #3a8a5a; }
    #chat-send:disabled { background: #ccc; cursor: not-allowed; }
    #close-chat-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #bbb; flex-shrink: 0; line-height: 1; padding: 2px 4px; border-radius: 50%; }
    #close-chat-btn:hover { color: #888; background: #f0f0ec; }
    #toggle-btn {
      position: fixed; top: 50%; right: 270px; transform: translateY(-50%);
      width: 18px; height: 52px; background: #f0f0ec; border: 1px solid #ddddd8;
      border-left: none; border-radius: 0 6px 6px 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: right 0.25s ease, background 0.15s; color: #888; font-size: 10px; user-select: none;
    }
    #toggle-btn:hover { background: #e2e2de; color: #444; }
    #toggle-btn.panel-collapsed { right: 0; }
    #panel { width: 270px; height: 100%; background: #f7f7f5; border-left: 1px solid #e0e0dc; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.25s ease, opacity 0.25s ease; overflow: hidden; }
    #panel.collapsed { width: 0; opacity: 0; border-left: none; }
    #panel-inner { width: 270px; height: 100%; display: flex; flex-direction: column; }
    #env-strip-wrap { padding: 12px 0 0; background: #f7f7f5; border-bottom: 1px solid #e0e0dc; flex-shrink: 0; }
    #env-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scroll-behavior: smooth; scrollbar-width: none; }
    #env-strip::-webkit-scrollbar { display: none; }
    .env-btn { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid transparent; background: #fff; cursor: pointer; transition: all 0.15s ease; font-size: 11px; color: #666; font-weight: 500; }
    .env-btn .icon { font-size: 22px; }
    .env-btn:hover { background: #eee; }
    .env-btn.active { border-color: #4a9e6b; background: #edf7f1; color: #2e7d50; }
    #animals-area { flex: 1; overflow-y: auto; padding: 14px 12px; scrollbar-width: thin; scrollbar-color: #ddd transparent; }
    #env-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 10px; }
    #animals-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .animal-card { background: #fff; border: 1px solid #e4e4e0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 6px 8px; gap: 4px; cursor: grab; transition: all 0.12s ease; user-select: none; }
    .animal-card:hover { border-color: #4a9e6b; background: #f4fbf7; transform: scale(1.04); }
    .animal-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .animal-card .emoji { font-size: 26px; line-height: 1; pointer-events: none; }
    .animal-card .name  { font-size: 10px; color: #888; font-weight: 500; text-align: center; line-height: 1.2; pointer-events: none; }
    #panel-footer{padding:10px 12px;border-top:1px solid #e0e0dc;flex-shrink:0;display:flex;flex-direction:column;gap:7px;}
    .panel-action-btn{width:100%;padding:9px 0;border:none;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;}
    #clear-all-btn{background:#fee2e2;color:#b91c1c;}
    #clear-all-btn:hover{background:#fca5a5;}
    #delete-mode-btn{background:#f3e8ff;color:#7c3aed;}
    #delete-mode-btn:hover{background:#e9d5ff;}
    #delete-mode-btn.active{background:#7c3aed;color:#fff;}
    #drop-hint { position: absolute; inset: 0; pointer-events: none; z-index: 5; border: 3px dashed #4a9e6b; opacity: 0; transition: opacity 0.15s; background: rgba(74,158,107,0.04); display: flex; align-items: center; justify-content: center; }
    #drop-hint.active { opacity: 1; }
    #drop-hint span { font-size: 16px; color: #4a9e6b; font-weight: 600; background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 20px; }
    #spawn-limit-msg{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:#fff1f1;color:#b91c1c;border:2px solid #fca5a5;border-radius:12px;padding:10px 24px;font-size:14px;font-weight:700;z-index:30;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 4px 18px rgba(185,28,28,0.13);}
    #char-warning{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#fff1f1;color:#b91c1c;border:1.5px solid #fca5a5;border-radius:20px;padding:6px 18px;font-size:13px;font-weight:700;z-index:30;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.2s;box-shadow:0 2px 12px rgba(185,28,28,0.10);}
    #char-warning.show{opacity:1;}
    #char-count{font-size:11px;color:#bbb;flex-shrink:0;font-weight:600;min-width:42px;text-align:right;transition:color 0.15s;}
    #char-count.at-limit{color:#b91c1c;}
    /* ── Settings ── */
    #settings-btn{position:absolute;top:12px;left:12px;width:42px;height:42px;background:rgba(0,0,0,0.52);border:none;border-radius:13px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:25;backdrop-filter:blur(4px);transition:background 0.15s,transform 0.2s;box-shadow:0 2px 12px rgba(0,0,0,0.22);}
    #settings-btn:hover{background:rgba(0,0,0,0.78);transform:rotate(30deg);}
    #settings-panel{position:absolute;top:62px;left:12px;background:rgba(255,255,255,0.97);border:1px solid #e0e0dc;border-radius:18px;padding:18px 20px;z-index:25;width:260px;box-shadow:0 8px 36px rgba(0,0,0,0.16);display:flex;flex-direction:column;gap:14px;}
    #settings-panel.hidden{display:none;}
    .stg-title{font-size:11px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.07em;}
    .stg-row{display:flex;align-items:center;gap:9px;}
    .stg-slider{flex:1;-webkit-appearance:none;height:5px;border-radius:3px;background:#e8e8e4;outline:none;cursor:pointer;}
    .stg-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4a9e6b;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,0.22);}
    .stg-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#4a9e6b;border:none;cursor:pointer;}
    .stg-val{font-size:12px;color:#888;min-width:38px;text-align:right;font-weight:700;}
    #speed-val{font-size:18px;font-weight:800;color:#4a9e6b;text-align:center;letter-spacing:-.01em;}
    #mute-btn{flex-shrink:0;background:#f3f4f6;border:1.5px solid #e0e0dc;border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;font-weight:600;color:#555;transition:all 0.15s;white-space:nowrap;}
    #mute-btn:hover{background:#eaeaea;}
    #mute-btn.on{background:#edf7f1;border-color:#4a9e6b;color:#2e7d50;}
    .stg-divider{height:1px;background:#f0f0ec;margin:2px 0;}
  </style>
</head>
<body>
<div id="layout">
  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="drop-hint"><span>Drop animal here!</span></div>
    <!-- Settings -->
    <button id="settings-btn" title="Settings">⚙</button>
    <div id="settings-panel" class="hidden">
      <div class="stg-title">⚙ Settings</div>
      <div class="stg-divider"></div>
      <div>
        <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:8px;">🐾 Animal Speed</div>
        <div id="speed-val">1.0×</div>
        <div class="stg-row" style="margin-top:6px;">
          <span class="stg-val" style="min-width:28px;text-align:left;color:#bbb;">¼×</span>
          <input type="range" class="stg-slider" id="speed-slider" min="0.25" max="3" step="0.05" value="1">
          <span class="stg-val" style="color:#bbb;">3×</span>
        </div>
      </div>
      <div class="stg-divider"></div>
      <div>
        <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:10px;">🔊 Ambient Sound</div>
        <div class="stg-row" style="margin-bottom:10px;">
          <button id="mute-btn" class="on">🔊 On</button>
          <span id="sound-status" style="font-size:12px;color:#4a9e6b;flex:1;text-align:right;">Playing</span>
        </div>
        <div class="stg-row">
          <span style="font-size:15px;">🔈</span>
          <input type="range" class="stg-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.35">
          <span class="stg-val" id="vol-label">35%</span>
        </div>
      </div>
    </div>
    <div id="spawn-limit-msg">⚠ Biome is full! Maximum 12 animals per world.</div>
    <div id="char-warning">⚠ You've reached the 100 character limit!</div>
    <div id="loading-overlay" class="hidden">
      <span id="loading-emoji"></span>
      <div id="loading-text"></div>
      <div id="loading-sub">Getting ready to chat!</div>
      <div id="loading-dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div id="speech-bar" class="hidden">
      <button id="close-chat-btn" title="Stop chatting">✕</button>
      <input id="chat-input" type="text" placeholder="Say something..." />
      <span id="char-count">0/100</span>
      <button id="chat-send">&#x279C;</button>
    </div>
  </div>
  <button id="toggle-btn" title="Toggle panel">&#x276F;</button>
  <div id="panel">
    <div id="panel-inner">
      <div id="env-strip-wrap"><div id="env-strip"></div></div>
      <div id="animals-area">
        <div id="env-label"></div>
        <div id="animals-grid"></div>
      </div>
      <div id="panel-footer">
        <button class="panel-action-btn" id="clear-all-btn">🗑 Clear All Animals</button>
        <button class="panel-action-btn" id="delete-mode-btn">✂ Delete an Animal</button>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
let worlds = [], activeWorldId = null, worldIdCounter = 0, animalIdCounter = 0, pendingNewWorld = null;
const ENV_ICONS = { jungle:'🌿', ocean:'🌊', desert:'🏜️', arctic:'🧊', savanna:'🦁', forest:'🌲', farm:'🌾' };
const TAB_H=40, TAB_W=90, TAB_GAP=6, TAB_MARGIN=12, NEW_BTN_W=46;
let gameSpeed=1.0; // controlled by settings slider
const BAD_WORDS=['fuck','shit','bitch','ass','damn','crap','bastard','dick','cock','pussy','cunt','piss','hell','wtf','stfu','idiot','stupid','hate','kill','die','ugly'];
function hasBadWord(t){const l=t.toLowerCase();return BAD_WORDS.some(w=>new RegExp('\\b'+w+'\\b').test(l));}

// ── Move types — Flamingo/Chicken/Turkey/Rooster/Duck are WALKERS ──
const FLY_NAMES   = new Set(['Macaw','Butterfly','Snowy Owl','Snow Bunting','Dove','Crow','Bee','Vulture','Peacock','Swan']);
const SWIM_NAMES  = new Set(['Shark','Dolphin','Octopus','Whale','Clownfish','Squid','Blowfish','Tuna','Narwhal','Seal']);
const FLOOR_NAMES = new Set(['Crab','Lobster','Shrimp']);
const DRIFT_NAMES = new Set(['Jellyfish']);
const SWING_NAMES = new Set(['Monkey']);

function getMoveType(name){
  if(FLY_NAMES.has(name))return'fly';
  if(SWIM_NAMES.has(name))return'swim';
  if(FLOOR_NAMES.has(name))return'floor';
  if(DRIFT_NAMES.has(name))return'drift';
  if(SWING_NAMES.has(name))return'swing';
  return'walk';
}
function getActiveWorld(){return worlds.find(w=>w.id===activeWorldId)||null;}
function createWorld(envId,envLabel){const w={id:worldIdCounter++,envId,envLabel,animals:[]};worlds.push(w);activeWorldId=w.id;return w;}

// ════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let activeChatAnimal=null,currentSpeech='',userSpeech='';
let snowflakes=[], jungleTrees=[];
let _t=0; // global animation time, incremented in loop

function resize(){const a=document.getElementById('game-area');canvas.width=a.clientWidth;canvas.height=a.clientHeight;jungleTrees=[];}
window.addEventListener('resize',resize);
resize();

// ANIMAL VISUAL DATA
// ════════════════════════════════════════

  'Dove':        {body:'#e0e0e0',accent:'#bdbdbd',shape:'bird'},
  'Crow':        {body:'#212121',accent:'#424242',shape:'bird'},
  'Bee':         {body:'#fdd835',accent:'#212121',shape:'bee'},
  'Snail':       {body:'#ff8a65',accent:'#795548',shape:'snail'},
};

function dk(hex,amt){
  if(!hex||hex[0]!=='#')return hex||'#888';
  if(hex.length===4)hex='#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  if(isNaN(r)||isNaN(g)||isNaN(b))return hex;
  r=Math.max(0,r-amt);g=Math.max(0,g-amt);b=Math.max(0,b-amt);
  return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ════════════════════════════════════════
// DRAW UTILITIES
// ════════════════════════════════════════
function wrapText(ctx,text,maxW){
  const words=text.split(' '),lines=[];let line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);return lines;
}
function drawRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
// ── Bubble state ──
let bubbleExpanded=false;
let moreButtonRect=null; // {x,y,w,h} in canvas coords

function drawBubble(text,ax,ay,isUser,stackAbove){
  // stackAbove: optional {x,y,w,h} rect to stack this bubble above
  // Returns the drawn bubble rect {x,y,w,h}
  if(!text)return null;
  const pad=13,lh=21,maxW=210,r=13;
  const MAX_LINES=4;
  ctx.font='14px system-ui';
  const allLines=wrapText(ctx,text,maxW);
  const hasMore=!isUser&&allLines.length>MAX_LINES;
  const showLines=(hasMore&&!bubbleExpanded)?allLines.slice(0,MAX_LINES):allLines;
  const contentW=Math.max(...showLines.map(l=>ctx.measureText(l).width),50);
  const bw=contentW+pad*2;
  const moreBtnH=hasMore?26:0;
  const bh=showLines.length*lh+pad*2+moreBtnH;

  // Horizontal: prefer right of animal, flip left if no room
  const GAP=62;
  let bx=ax+GAP,tailSide='left';
  if(bx+bw>canvas.width-10){bx=ax-GAP-bw;tailSide='right';}
  bx=Math.max(8,Math.min(canvas.width-bw-8,bx));

  // Vertical: stack above given rect, or center on animal
  let by;
  if(stackAbove){by=stackAbove.y-bh-8;}
  else{by=ay-bh/2;}
  by=Math.max(8,Math.min(canvas.height-bh-80,by)); // 80px bottom clearance for tabs

  // ── Background + shadow ──
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.13)';ctx.shadowBlur=14;ctx.shadowOffsetY=4;
  drawRoundRect(ctx,bx,by,bw,bh,r);
  ctx.fillStyle=isUser?'#4a9e6b':'#fff';ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=isUser?'#3a8a5a':'#e0e0dc';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();

  // ── Horizontal tail ──
  const tailY=Math.min(by+bh-r-8,Math.max(by+r+8,ay));
  ctx.save();
  ctx.beginPath();
  if(tailSide==='left'){
    ctx.moveTo(bx,tailY-7);ctx.lineTo(bx-14,tailY);ctx.lineTo(bx,tailY+7);
  }else{
    ctx.moveTo(bx+bw,tailY-7);ctx.lineTo(bx+bw+14,tailY);ctx.lineTo(bx+bw,tailY+7);
  }
  ctx.fillStyle=isUser?'#4a9e6b':'#fff';ctx.fill();
  ctx.restore();

  // ── Text ──
  ctx.save();
  ctx.font='14px system-ui';ctx.fillStyle=isUser?'#fff':'#222';
  ctx.textAlign='left';ctx.textBaseline='top';
  showLines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+pad+i*lh));

  // ── Expand/collapse button ──
  if(hasMore){
    const btnLabel=bubbleExpanded?'▲ less':'… ▼ more';
    ctx.font='bold 11px system-ui';
    const btnW=ctx.measureText(btnLabel).width+16;
    const btnH=19;
    const btnX=bx+bw-btnW-8;
    const btnY=by+bh-btnH-6;
    drawRoundRect(ctx,btnX,btnY,btnW,btnH,9);
    ctx.fillStyle='rgba(74,158,107,0.13)';ctx.fill();
    ctx.fillStyle='#4a9e6b';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(btnLabel,btnX+btnW/2,btnY+btnH/2);
    moreButtonRect={x:btnX,y:btnY,w:btnW,h:btnH};
  }else if(!hasMore&&!isUser){moreButtonRect=null;}
  ctx.restore();

  return{x:bx,y:by,w:bw,h:bh};
}

function legs(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

// ── CAT (tiger, lion, leopard, bobcat) ──
function drawCat(a,d){
  const p=a.phase,ls=Math.sin(p*3)*13;
  // curled tail
  ctx.strokeStyle=d.accent||dk(d.body,25);ctx.lineWidth=5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-28,-6);ctx.quadraticCurveTo(-40,-18,-36,-28);ctx.stroke();
  // legs
  ctx.strokeStyle=dk(d.body,25);ctx.lineWidth=5;
  [[20,10,ls],[20,10,-ls],[-18,10,-ls],[-18,10,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.5,ly+20));
  // sleek low body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,28,12,0,0,Math.PI*2);ctx.fill();
  // stripes
  if(d.stripes){ctx.strokeStyle=d.accent;ctx.lineWidth=3.5;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*9,-12);ctx.lineTo(i*9+4,12);ctx.stroke();}}
  // spots
  if(d.spots){ctx.fillStyle=d.accent;[[-12,-3],[5,-6],[15,2],[-3,6],[10,-1]].forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,3.5,0,Math.PI*2);ctx.fill();});}
  // big mane ring for lion
  if(d.mane){ctx.fillStyle=d.accent;ctx.beginPath();ctx.arc(26,-8,18,0,Math.PI*2);ctx.fill();}
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(26,-8,13,0,Math.PI*2);ctx.fill();
  // pointed ears
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(18,-20);ctx.lineTo(14,-32);ctx.lineTo(26,-22);ctx.fill();
  ctx.beginPath();ctx.moveTo(30,-20);ctx.lineTo(36,-32);ctx.lineTo(38,-21);ctx.fill();
  ctx.fillStyle='#e91e63';
  ctx.beginPath();ctx.moveTo(19,-21);ctx.lineTo(16,-29);ctx.lineTo(25,-22);ctx.fill();
  ctx.beginPath();ctx.moveTo(31,-21);ctx.lineTo(35,-29);ctx.lineTo(37,-22);ctx.fill();
  // eye+nose
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(31,-10,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(32,-11,1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e91e63';ctx.beginPath();ctx.arc(38,-6,2.5,0,Math.PI*2);ctx.fill();
  // whisker dots
  ctx.fillStyle='#222';[33,35,33].forEach((wx,i)=>{ctx.beginPath();ctx.arc(wx,-4+i*3,1,0,Math.PI*2);ctx.fill();});
}

// ── HORSE (horse, donkey, zebra) ──
function drawHorse(a,d){
  const p=a.phase,ls=Math.sin(p*3)*14;
  // legs – slim and long
  ctx.strokeStyle=dk(d.body,30);ctx.lineWidth=4;ctx.lineCap='round';
  [[18,10,ls],[18,10,-ls],[-16,10,-ls],[-16,10,ls]].forEach(([lx,ly,sw])=>{
    legs(lx,ly,lx+sw*.45,ly+30);
    ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(lx+sw*.45,ly+32,4,2.5,0,0,Math.PI*2);ctx.fill();
  });
  // flowing tail
  ctx.strokeStyle=d.accent;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-26,-4);ctx.quadraticCurveTo(-40,8,-36,24);ctx.stroke();
  // body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,26,14,0,0,Math.PI*2);ctx.fill();
  if(d.stripes){ctx.strokeStyle=d.accent;ctx.lineWidth=4;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*10,-14);ctx.lineTo(i*10+4,14);ctx.stroke();}}
  // long neck
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(16,-10);ctx.lineTo(22,-46);ctx.lineTo(8,-46);ctx.lineTo(4,-10);ctx.closePath();ctx.fill();
  // mane along neck
  if(d.mane){ctx.strokeStyle=d.accent;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(16,-10);ctx.lineTo(20,-44);ctx.stroke();}
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(28,-52,12,9,.3,0,Math.PI*2);ctx.fill();
  // muzzle
  ctx.fillStyle=dk(d.body,15);ctx.beginPath();ctx.ellipse(38,-50,7,5,.2,0,Math.PI*2);ctx.fill();
  // nostrils
  ctx.fillStyle=dk(d.body,30);ctx.beginPath();ctx.arc(36,-48,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(40,-48,1.5,0,Math.PI*2);ctx.fill();
  // ear
  if(d.ears==='long'){ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(20,-58);ctx.lineTo(18,-78);ctx.lineTo(26,-58);ctx.fill();}
  else{ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(20,-60);ctx.lineTo(18,-72);ctx.lineTo(26,-60);ctx.fill();}
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(33,-54,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(34,-55,1,0,Math.PI*2);ctx.fill();
}

// ── BEAR (bear, polar bear, panda) ──
function drawBear(a,d){
  const p=a.phase,ls=Math.sin(p*3)*8;
  ctx.strokeStyle=dk(d.body,25);ctx.lineWidth=8;ctx.lineCap='round';
  [[18,12,ls],[18,12,-ls],[-18,12,-ls],[-18,12,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.3,ly+16));
  // round stocky body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,26,20,0,0,Math.PI*2);ctx.fill();
  // panda patches on body
  if(d.panda){ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(-12,4,9,7,-.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(10,5,8,6,.3,0,Math.PI*2);ctx.fill();}
  // BIG round head (nearly body-width)
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(22,-16,18,0,Math.PI*2);ctx.fill();
  // panda eye patches
  if(d.panda){ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(16,-18,7,5,-.3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(26,-18,7,5,.3,0,Math.PI*2);ctx.fill();}
  // snout
  ctx.fillStyle=dk(d.body,12);ctx.beginPath();ctx.ellipse(34,-14,9,7,.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.ellipse(36,-12,3,2,0,0,Math.PI*2);ctx.fill();
  // round ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(10,-32,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(24,-32,8,0,Math.PI*2);ctx.fill();
  if(d.panda){ctx.fillStyle=d.accent;ctx.beginPath();ctx.arc(10,-32,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(24,-32,6,0,Math.PI*2);ctx.fill();}
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(29,-18,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(30,-19,1.2,0,Math.PI*2);ctx.fill();
}

// ── ELEPHANT ──
function drawElephant(a,d){
  const p=a.phase,ls=Math.sin(p*3)*8;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=11;ctx.lineCap='round';
  [[22,16,ls],[22,16,-ls],[-18,16,-ls],[-18,16,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.2,ly+22));
  // massive body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,34,22,0,0,Math.PI*2);ctx.fill();
  // big head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(28,-14,22,0,Math.PI*2);ctx.fill();
  // floppy ear (left side flap)
  const earFlap=Math.sin(p*1.5)*6;
  ctx.fillStyle=dk(d.body,8);ctx.beginPath();ctx.ellipse(12,-14+earFlap,24,30,-.25,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#f4a0a0';ctx.beginPath();ctx.ellipse(12,-14+earFlap,15,20,-.25,0,Math.PI*2);ctx.fill();
  // head on top of ear
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(28,-14,22,0,Math.PI*2);ctx.fill();
  // long trunk swinging
  const trunkWave=Math.sin(p*1.5)*10;
  ctx.strokeStyle=d.body;ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(48,-10);ctx.quadraticCurveTo(58,-2+trunkWave,54,20+trunkWave);ctx.stroke();
  // trunk tip curl
  ctx.beginPath();ctx.arc(54,22+trunkWave,4,0,Math.PI*2);ctx.stroke();
  // tusk
  ctx.strokeStyle='#f5f0dc';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(46,-6);ctx.quadraticCurveTo(56,2,54,14);ctx.stroke();
  // tiny eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(42,-20,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(43,-21,1.3,0,Math.PI*2);ctx.fill();
  // small top ear
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(18,-34,6,0,Math.PI*2);ctx.fill();
}

// ── GIRAFFE ──
function drawGiraffe(a,d){
  const p=a.phase,ls=Math.sin(p*3)*11;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=3.5;ctx.lineCap='round';
  [[16,10,ls],[10,10,-ls],[-10,10,-ls],[-16,10,ls]].forEach(([lx,ly,sw])=>{
    legs(lx,ly,lx+sw*.4,ly+34);
    ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(lx+sw*.4,ly+36,3.5,2.5,0,0,Math.PI*2);ctx.fill();
  });
  // small body with spots
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,22,13,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;[[-10,-2,8,5],[6,-5,7,5],[14,3,6,4],[-2,6,7,4]].forEach(([sx,sy,sw,sh])=>{ctx.beginPath();ctx.ellipse(sx,sy,sw,sh,.4,0,Math.PI*2);ctx.fill();});
  // VERY long neck — this is what makes a giraffe!
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(14,-10);ctx.lineTo(18,-90);ctx.lineTo(6,-90);ctx.lineTo(2,-10);ctx.closePath();ctx.fill();
  // spots on neck
  ctx.fillStyle=d.accent;
  for(let i=0;i<6;i++){ctx.beginPath();ctx.ellipse(10+Math.sin(i)*3,-(18+i*12),5,3.5,.3,0,Math.PI*2);ctx.fill();}
  // small head at top
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(18,-96,10,7,.2,0,Math.PI*2);ctx.fill();
  // ossicones (little bumpy horns)
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(12,-104,2.5,5,-.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(18,-104,2.5,5,.1,0,Math.PI*2);ctx.fill();
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(23,-97,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(24,-98,1,0,Math.PI*2);ctx.fill();
}

// ── CROCODILE — long, flat, ridged ──
function drawCroc(a,d){
  const p=a.phase,ls=Math.sin(p*3)*5;
  const tailSwing=Math.sin(p*1.5)*14;
  // short splayed legs
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=4;ctx.lineCap='round';
  legs(16,6,28,16+ls);legs(16,6,28,-4+ls);legs(-12,6,-24,16-ls);legs(-12,6,-24,-4-ls);
  // swinging tail
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(-40,0);ctx.quadraticCurveTo(-58,tailSwing,-70,tailSwing*1.4);ctx.quadraticCurveTo(-58,6+tailSwing*.3,-40,7);ctx.closePath();ctx.fill();
  // VERY long flat body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-8,0,44,10,0,0,Math.PI*2);ctx.fill();
  // ridged spine — very distinctive!
  ctx.fillStyle=dk(d.body,18);
  for(let i=-4;i<=4;i++){ctx.beginPath();ctx.moveTo(i*9-4,-10);ctx.lineTo(i*9-6,-20);ctx.lineTo(i*9+2,-20);ctx.lineTo(i*9+4,-10);ctx.closePath();ctx.fill();}
  // belly color
  ctx.fillStyle=d.belly||'#a5d6a7';ctx.beginPath();ctx.ellipse(-8,4,42,6,0,0,Math.PI*2);ctx.fill();
  // long flat snout
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(36,-8);ctx.lineTo(72,-6);ctx.lineTo(72,8);ctx.lineTo(36,8);ctx.closePath();ctx.fill();
  // teeth along snout
  ctx.fillStyle='#fff';
  for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(40+i*5,-8);ctx.lineTo(42+i*5,-14);ctx.lineTo(44+i*5,-8);ctx.fill();}
  // eye on TOP of head (croc eyes are on top!)
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(32,-12,6,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(32,-12,2,3.5,0,0,Math.PI*2);ctx.fill();
}

// ── RHINO ──
function drawRhino(a,d){
  const p=a.phase,ls=Math.sin(p*3)*8;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=10;ctx.lineCap='round';
  [[20,14,ls],[20,14,-ls],[-16,14,-ls],[-16,14,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.2,ly+18));
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,32,20,0,0,Math.PI*2);ctx.fill();
  // skin fold lines
  ctx.strokeStyle=dk(d.body,18);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(14,-20);ctx.lineTo(14,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-14,-20);ctx.lineTo(-14,20);ctx.stroke();
  // big wide head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(36,-6,22,17,.05,0,Math.PI*2);ctx.fill();
  // BIG horns — what makes a rhino!
  ctx.fillStyle=dk(d.body,35);
  ctx.beginPath();ctx.moveTo(50,-22);ctx.lineTo(62,-42);ctx.lineTo(56,-18);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(44,-18);ctx.lineTo(52,-32);ctx.lineTo(48,-14);ctx.closePath();ctx.fill();
  // small ear
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(22,-22,7,0,Math.PI*2);ctx.fill();
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(40,-12,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(41,-13,1.3,0,Math.PI*2);ctx.fill();
}

// ── HIPPO ──
function drawHippo(a,d){
  const p=a.phase,ls=Math.sin(p*3)*7;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=10;ctx.lineCap='round';
  [[20,16,ls],[20,16,-ls],[-18,16,-ls],[-18,16,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.2,ly+16));
  // giant round body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,32,22,0,0,Math.PI*2);ctx.fill();
  // HUGE head — almost as big as body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(34,2,26,20,.05,0,Math.PI*2);ctx.fill();
  // wide open mouth area
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(44,10,18,10,.05,0,Math.PI);ctx.fill();
  // big teeth
  ctx.fillStyle='#fffde7';ctx.beginPath();ctx.moveTo(34,10);ctx.lineTo(34,22);ctx.lineTo(40,10);ctx.fill();
  ctx.beginPath();ctx.moveTo(46,10);ctx.lineTo(48,22);ctx.lineTo(54,10);ctx.fill();
  // nostrils on top of snout
  ctx.fillStyle=dk(d.body,25);
  ctx.beginPath();ctx.ellipse(52,-4,5,4,.2,0,Math.PI*2);ctx.fill();

  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(20,-20,6,0,Math.PI*2);ctx.fill();
}

// ── CAMEL ──
function drawCamel(a,d){
  const p=a.phase,ls=Math.sin(p*3)*13;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=5;ctx.lineCap='round';
  [[18,10,ls],[18,10,-ls],[-14,10,-ls],[-14,10,ls]].forEach(([lx,ly,sw])=>{
    legs(lx,ly,lx+sw*.4,ly+30);
    ctx.fillStyle=dk(d.body,10);ctx.beginPath();ctx.ellipse(lx+sw*.4,ly+32,6,4,0,0,Math.PI*2);ctx.fill();
  });
  // body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,26,14,0,0,Math.PI*2);ctx.fill();
  // BIG HUMP — the camel's signature!
  ctx.fillStyle=dk(d.body,10);ctx.beginPath();ctx.ellipse(2,-24,13,20,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(2,-14,13,12,0,0,Math.PI*2);ctx.fill();
  // long curved neck
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(18,-10);ctx.quadraticCurveTo(32,-24,24,-46);ctx.quadraticCurveTo(18,-50,12,-46);ctx.quadraticCurveTo(16,-26,8,-10);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(24,-52,12,8,.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.body,10);ctx.beginPath();ctx.ellipse(34,-50,7,5,.2,0,Math.PI*2);ctx.fill();
  // camel lips (distinctive droopy lips)
  ctx.fillStyle=dk(d.body,20);ctx.beginPath();ctx.ellipse(38,-48,5,4,.2,0,Math.PI*2);ctx.fill();
  // ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(16,-60,4,7,-.2,0,Math.PI*2);ctx.fill();
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(28,-54,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(29,-55,1,0,Math.PI*2);ctx.fill();
}

// ── PIG ──
function drawPig(a,d){
  const p=a.phase,ls=Math.sin(p*3)*7;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=7;ctx.lineCap='round';
  [[16,14,ls],[16,14,-ls],[-16,14,-ls],[-16,14,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.2,ly+12));
  // curly tail
  ctx.strokeStyle=d.body;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(-30,-4,8,-.3,Math.PI*.8);ctx.stroke();
  // very round fat body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,24,20,0,0,Math.PI*2);ctx.fill();
  // round head same size as body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(26,-8,16,0,Math.PI*2);ctx.fill();
  // round ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(16,-22,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(28,-22,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.arc(16,-22,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(28,-22,5,0,Math.PI*2);ctx.fill();
  // BIG round snout — very distinctive!
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(40,-6,11,9,.05,0,Math.PI*2);ctx.fill();
  // nostrils
  ctx.fillStyle=dk(d.accent,30);ctx.beginPath();ctx.ellipse(37,-6,3,2.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(43,-6,3,2.5,0,0,Math.PI*2);ctx.fill();
  // eye
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(32,-12,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(33,-13,1.2,0,Math.PI*2);ctx.fill();
}

// ── RABBIT ──
function drawRabbit(a,d){
  const p=a.phase;
  const hop=Math.abs(Math.sin(p*3))*7;
  // big back feet
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-10,18,10,5,.4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(10,18,10,5,-.4,0,Math.PI*2);ctx.fill();
  // upright oval body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,2,14,18,0,0,Math.PI*2);ctx.fill();
  // small front paws
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=4;ctx.lineCap='round';
  legs(10,6,14,14-hop);legs(-10,6,-14,14-hop);
  // fluffy round head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(4,-18,13,0,Math.PI*2);ctx.fill();
  // VERY LONG upright ears — unmistakable rabbit feature!
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-3,-36,5,20,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(9,-36,5,20,.08,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(-3,-36,2.5,15,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(9,-36,2.5,15,.08,0,Math.PI*2);ctx.fill();
  // fluffy tail
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,6,7,0,Math.PI*2);ctx.fill();
  // nose + eye
  ctx.fillStyle='#ff9999';ctx.beginPath();ctx.arc(14,-18,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(10,-22,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(11,-23,1,0,Math.PI*2);ctx.fill();
}

// ── GORILLA ──
function drawGorilla(a,d){
  const p=a.phase,ls=Math.sin(p*3)*10;
  // LONG arms reaching ground — knuckle walk!
  ctx.strokeStyle=dk(d.body,15);ctx.lineWidth=9;ctx.lineCap='round';
  legs(22,-2,38,22+ls*.5);legs(-22,-2,-36,22-ls*.5);
  // knuckle fists
  ctx.fillStyle=dk(d.body,20);ctx.beginPath();ctx.ellipse(38,24+ls*.5,8,5,.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-36,24-ls*.5,8,5,-.2,0,Math.PI*2);ctx.fill();
  // short legs
  ctx.lineWidth=8;legs(14,18,14+ls*.3,36);legs(-14,18,-14-ls*.3,36);
  // barrel chest — much bigger than the hips
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,2,28,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(0,4,16,14,0,0,Math.PI*2);ctx.fill();
  // massive heavy head, barely a neck
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(4,-22,20,18,0,0,Math.PI*2);ctx.fill();
  // sagittal crest (ridge on top of skull)
  ctx.fillStyle=dk(d.body,12);ctx.beginPath();ctx.ellipse(4,-38,6,10,0,0,Math.PI*2);ctx.fill();
  // dark flat face
  ctx.fillStyle='#2c1810';ctx.beginPath();ctx.ellipse(8,-20,14,13,.05,0,Math.PI*2);ctx.fill();
  // light muzzle
  ctx.fillStyle='#8d6e63';ctx.beginPath();ctx.ellipse(10,-15,9,8,.1,0,Math.PI*2);ctx.fill();
  // small ears low on head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(-14,-20,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,-20,7,0,Math.PI*2);ctx.fill();
  // eyes
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(4,-22,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-22,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-23,1.2,0,Math.PI*2);ctx.fill();
}

// ── DEER / REINDEER ──
function drawDeer(a,d){
  const p=a.phase,ls=Math.sin(p*3)*13;
  ctx.strokeStyle=dk(d.body,25);ctx.lineWidth=3.5;ctx.lineCap='round';
  [[16,10,ls],[12,10,-ls],[-12,10,-ls],[-16,10,ls]].forEach(([lx,ly,sw])=>{
    legs(lx,ly,lx+sw*.45,ly+28);
    ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(lx+sw*.45,ly+30,3,2,0,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,22,12,0,0,Math.PI*2);ctx.fill();
  // neck
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(14,-10);ctx.lineTo(18,-38);ctx.lineTo(6,-38);ctx.lineTo(2,-10);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(20,-44,10,8,.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.body,12);ctx.beginPath();ctx.ellipse(28,-42,6,5,.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(14,-50,4,7,-.3,0,Math.PI*2);ctx.fill();
  // EYE
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(26,-46,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(27,-47,1,0,Math.PI*2);ctx.fill();
  // BIG ANTLERS — unmistakable reindeer feature!
  ctx.strokeStyle=d.accent||'#5d4037';ctx.lineWidth=3;ctx.lineCap='round';
  // left antler
  ctx.beginPath();ctx.moveTo(14,-50);ctx.lineTo(6,-70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(9,-62);ctx.lineTo(-2,-66);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-70);ctx.lineTo(-4,-76);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,-70);ctx.lineTo(10,-78);ctx.stroke();
  // right antler
  ctx.beginPath();ctx.moveTo(22,-50);ctx.lineTo(30,-70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(27,-62);ctx.lineTo(38,-66);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,-70);ctx.lineTo(40,-76);ctx.stroke();
  ctx.beginPath();ctx.moveTo(30,-70);ctx.lineTo(26,-78);ctx.stroke();
}

// ── WOLF / DINGO ──
function drawWolf(a,d){
  const p=a.phase,ls=Math.sin(p*3)*12;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=4.5;ctx.lineCap='round';
  [[18,10,ls],[18,10,-ls],[-16,10,-ls],[-16,10,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.4,ly+22));
  // bushy tail
  ctx.fillStyle=dk(d.body,8);ctx.beginPath();ctx.ellipse(-32,-4,14,9,-.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-38,-2,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,26,13,0,0,Math.PI*2);ctx.fill();
  // neck + head with pointed snout
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(16,-10);ctx.lineTo(20,-34);ctx.lineTo(8,-34);ctx.lineTo(4,-10);ctx.closePath();ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(20,-40,13,10,.1,0,Math.PI*2);ctx.fill();
  // POINTED snout
  ctx.beginPath();ctx.moveTo(22,-34);ctx.lineTo(38,-38);ctx.lineTo(22,-44);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(37,-38,2.5,0,Math.PI*2);ctx.fill();
  // pointed ears
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(12,-48);ctx.lineTo(8,-62);ctx.lineTo(20,-50);ctx.fill();
  ctx.beginPath();ctx.moveTo(24,-48);ctx.lineTo(30,-62);ctx.lineTo(32,-50);ctx.fill();
  ctx.fillStyle=d.accent;
  ctx.beginPath();ctx.moveTo(13,-49);ctx.lineTo(10,-58);ctx.lineTo(19,-51);ctx.fill();
  ctx.beginPath();ctx.moveTo(25,-49);ctx.lineTo(29,-58);ctx.lineTo(31,-51);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(26,-42,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(27,-43,1,0,Math.PI*2);ctx.fill();
}

// ── FENNEC FOX ──
function drawFox(a,d){
  const p=a.phase,ls=Math.sin(p*3)*11;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=3.5;ctx.lineCap='round';
  [[14,10,ls],[14,10,-ls],[-12,10,-ls],[-12,10,ls]].forEach(([lx,ly,sw])=>legs(lx,ly,lx+sw*.4,ly+18));
  // big fluffy tail
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-26,-2,14,9,-.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-32,-1,8,5,-.2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,20,11,0,0,Math.PI*2);ctx.fill();
  // neck + head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(12,-8);ctx.lineTo(15,-26);ctx.lineTo(5,-26);ctx.lineTo(3,-8);ctx.closePath();ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(14,-32,11,0,Math.PI*2);ctx.fill();
  // pointed snout
  ctx.beginPath();ctx.moveTo(16,-26);ctx.lineTo(28,-30);ctx.lineTo(16,-36);ctx.fill();
  ctx.fillStyle='#e91e63';ctx.beginPath();ctx.arc(27,-30,2.5,0,Math.PI*2);ctx.fill();
  // HUGE ears — what makes a fennec fox!
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(6,-40);ctx.lineTo(0,-62);ctx.lineTo(16,-42);ctx.fill();
  ctx.beginPath();ctx.moveTo(18,-40);ctx.lineTo(28,-62);ctx.lineTo(24,-42);ctx.fill();
  ctx.fillStyle=d.accent;
  ctx.beginPath();ctx.moveTo(7,-41);ctx.lineTo(2,-58);ctx.lineTo(14,-43);ctx.fill();
  ctx.beginPath();ctx.moveTo(19,-41);ctx.lineTo(26,-58);ctx.lineTo(23,-43);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(20,-34,2.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(21,-35,1,0,Math.PI*2);ctx.fill();
}

// ── FROG (tree frog) ──
function drawFrog(a,d){
  const p=a.phase,ext=Math.abs(Math.sin(p*3))*14;
  // back legs (frog legs!)
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=5;ctx.lineCap='round';
  legs(-12,10,-20-ext,22);legs(12,10,20+ext,22);
  // toe pads
  ctx.fillStyle=dk(d.body,10);ctx.beginPath();ctx.arc(-20-ext,22,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20+ext,22,5,0,Math.PI*2);ctx.fill();
  // small front arms
  ctx.lineWidth=3;legs(14,2,18,12);
  // wide flat body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,2,18,12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(0,4,11,8,0,0,Math.PI*2);ctx.fill();
  // wide head barely separate
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(14,-4,14,10,.1,0,Math.PI*2);ctx.fill();
  // BIG BULGING EYES on top
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(8,-12,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,-12,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(8,-12,4.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,-12,4.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-13,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(21,-13,1.5,0,Math.PI*2);ctx.fill();
  // wide smile line
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(2,2);ctx.lineTo(24,0);ctx.stroke();
}

// ── SLOTH ──
function drawSloth(a,d){
  const p=a.phase;
  // long arms hanging from above
  ctx.strokeStyle=dk(d.body,15);ctx.lineWidth=6;ctx.lineCap='round';
  legs(-10,-14,-22,-30);legs(10,-14,22,-30);
  // claws gripping
  ctx.fillStyle=dk(d.body,20);ctx.beginPath();ctx.arc(-22,-30,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(22,-30,5,0,Math.PI*2);ctx.fill();
  // small short legs dangling
  ctx.lineWidth=5;legs(-8,16,-6,30);legs(8,16,10,30);
  // round body hanging
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,2,18,20,0,0,Math.PI*2);ctx.fill();
  // round head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(0,-18,14,0,Math.PI*2);ctx.fill();
  // dark face mask
  ctx.fillStyle=dk(d.body,25);ctx.beginPath();ctx.ellipse(0,-18,9,10,0,0,Math.PI*2);ctx.fill();
  // light eye rings + big slow eyes
  ctx.fillStyle='#a1887f';ctx.beginPath();ctx.ellipse(-4,-18,5,4,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(4,-18,5,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-4,-18,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(4,-18,3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-3,-19,1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(5,-19,1,0,Math.PI*2);ctx.fill();
  // permanent smile
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-12,4,0,Math.PI);ctx.stroke();
  // small round ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.arc(-12,-28,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(12,-28,5,0,Math.PI*2);ctx.fill();
}

// ── LIZARD ──
function drawLizard(a,d){
  const p=a.phase,tailSwing=Math.sin(p*1.5)*16,ls=Math.sin(p*3)*8;
  // sprawling splayed legs
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=3;ctx.lineCap='round';
  legs(16,4,28,14+ls);legs(16,4,28,-6+ls);legs(-10,4,-22,14-ls);legs(-10,4,-22,-6-ls);
  // swinging tail (very long)
  ctx.strokeStyle=d.body;ctx.lineWidth=7;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-36,0);ctx.quadraticCurveTo(-52,tailSwing,-64,tailSwing*1.3);ctx.stroke();
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-60,tailSwing*1.2);ctx.lineTo(-76,tailSwing*1.5);ctx.stroke();
  // flat body
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-4,0,34,9,0,0,Math.PI*2);ctx.fill();
  // scale pattern
  ctx.strokeStyle=d.accent;ctx.lineWidth=1.5;
  for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*9,-9);ctx.lineTo(i*9,9);ctx.stroke();}
  // triangular head + long snout
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(30,-8);ctx.lineTo(54,0);ctx.lineTo(30,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ffd700';ctx.beginPath();ctx.ellipse(36,-3,4,3.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(36,-3,1.5,3,0,0,Math.PI*2);ctx.fill();
  // forked tongue
  ctx.strokeStyle='#e53935';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(52,0);ctx.lineTo(58,-3);ctx.stroke();ctx.beginPath();ctx.moveTo(52,0);ctx.lineTo(58,3);ctx.stroke();
}

// ── COW ──
function drawCow(a,d){
  const p=a.phase,ls=Math.sin(p*3)*10;
  ctx.strokeStyle=dk(d.body,20);ctx.lineWidth=5.5;ctx.lineCap='round';
  [[18,12,ls],[18,12,-ls],[-18,12,-ls],[-18,12,ls]].forEach(([lx,ly,sw])=>{
    legs(lx,ly,lx+sw*.3,ly+22);
    ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(lx+sw*.3,ly+24,4,3,0,0,Math.PI*2);ctx.fill();
  });
  // udder
  ctx.fillStyle='#ffb3ba';ctx.beginPath();ctx.ellipse(0,22,16,8,0,0,Math.PI*2);ctx.fill();
  // body with patches
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,0,28,16,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;[[-12,-4,12,8],[10,-6,9,7],[-2,7,8,5]].forEach(([sx,sy,sw,sh])=>{ctx.beginPath();ctx.ellipse(sx,sy,sw,sh,.4,0,Math.PI*2);ctx.fill();});
  // neck
  ctx.fillStyle=d.body;ctx.beginPath();ctx.moveTo(18,-12);ctx.lineTo(22,-28);ctx.lineTo(10,-28);ctx.lineTo(6,-12);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(26,-34,13,10,.1,0,Math.PI*2);ctx.fill();
  // big muzzle
  ctx.fillStyle=dk(d.body,12);ctx.beginPath();ctx.ellipse(36,-32,9,7,.1,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.body,28);ctx.beginPath();ctx.arc(33,-31,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(38,-31,2,0,Math.PI*2);ctx.fill();
  if(!d.ox){// udder marks only for cow, horns for both
    ctx.strokeStyle='#ffcdd2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,22);ctx.lineTo(0,30);ctx.stroke();
  }
  // horns
  ctx.strokeStyle=d.ox?'#b8a050':'#d4c56a';ctx.lineWidth=3.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(18,-42);ctx.lineTo(12,-52);ctx.stroke();ctx.beginPath();ctx.moveTo(26,-42);ctx.lineTo(32,-52);ctx.stroke();
  // ears
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(16,-38,5,8,-.35,0,Math.PI*2);ctx.fill();

  const ls=Math.sin(a.phase*4)*5;
  for(let i=0;i<4;i++){
    const ang1=Math.PI*.55+i*.2,ang2=ang1+.55;
    ctx.strokeStyle=d.body;ctx.lineWidth=3.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(Math.cos(ang1)*10,Math.sin(ang1)*8);ctx.lineTo(Math.cos(ang1)*22,Math.sin(ang1)*16+ls*(i%2?1:-1));ctx.lineTo(Math.cos(ang2)*30,Math.sin(ang2)*24+ls*(i%2?.5:-.5));ctx.stroke();
    ctx.beginPath();ctx.moveTo(-Math.cos(ang1)*10,Math.sin(ang1)*8);ctx.lineTo(-Math.cos(ang1)*22,Math.sin(ang1)*16-ls*(i%2?1:-1));ctx.lineTo(-Math.cos(ang2)*30,Math.sin(ang2)*24-ls*(i%2?.5:-.5));ctx.stroke();
  }
  if(d.tail==='sting'){
    ctx.strokeStyle=d.body;ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-10,-4);ctx.quadraticCurveTo(-26,-18,-24,-30);ctx.stroke();
    ctx.fillStyle=d.accent;ctx.beginPath();ctx.moveTo(-24,-30);ctx.lineTo(-30,-40);ctx.lineTo(-20,-28);ctx.fill();
  }
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-8,2,14,11,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(8,2,11,9,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';[[4,-4],[10,-6],[16,-4],[10,-1]].forEach(([ex,ey])=>{ctx.beginPath();ctx.arc(ex,ey,1.8,0,Math.PI*2);ctx.fill();});
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.moveTo(16,4);ctx.lineTo(22,8);ctx.lineTo(16,6);ctx.fill();ctx.beginPath();ctx.moveTo(16,2);ctx.lineTo(22,-2);ctx.lineTo(16,4);ctx.fill();
}

// ── SQUID ──
function drawSquid(a,d){
  for(let i=0;i<10;i++){
    const tx=-22+i*5,wave=Math.sin(a.phase*2+i*.5)*10;
    ctx.strokeStyle=d.body;ctx.lineWidth=i<2?5:3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(tx,12);ctx.quadraticCurveTo(tx+wave*.4,26,tx+wave*.6,i<2?42:34);ctx.stroke();
  }
  ctx.fillStyle=d.body;
  ctx.beginPath();ctx.moveTo(-20,-16);ctx.quadraticCurveTo(0,-28,20,-16);ctx.quadraticCurveTo(22,8,-18,8);ctx.closePath();ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.ellipse(0,-4,12,10,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-18,-12,10,6,-.6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(18,-12,10,6,.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-8,-2,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8,-2,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-8,-2,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(8,-2,3.5,0,Math.PI*2);ctx.fill();
}

// ── SHRIMP ──
function drawShrimp(a,d){
  const curl=Math.sin(a.phase*3)*.12;
  ctx.strokeStyle=d.body;ctx.lineWidth=9;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(20,0);ctx.quadraticCurveTo(0,-4,-14,8+curl*30);ctx.quadraticCurveTo(-24,18,-22,28);ctx.stroke();
  ctx.fillStyle=d.accent;
  for(let i=0;i<5;i++){const t=i/4;const x=20-34*t,y=-4*t+8*t*t+curl*30*t*t;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-22,30,8,5,-.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-18,32,6,4,-.5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=d.body;ctx.lineWidth=1.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(36,-10);ctx.stroke();ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(34,-4);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(20,-4,3,0,Math.PI*2);ctx.fill();
}

// ── SNAIL ──
function drawSnail(a,d){
  const ls=Math.sin(a.phase*3)*3;
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(0,10,20,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=d.accent;ctx.beginPath();ctx.arc(4,2,16,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.accent,20);ctx.beginPath();ctx.arc(6,2,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.accent,38);ctx.beginPath();ctx.arc(7,1,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.accent,52);ctx.beginPath();ctx.arc(7,0,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk(d.accent,62);ctx.beginPath();ctx.arc(7,-1,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(7,0,6,.5,3.5);ctx.stroke();
  ctx.fillStyle=d.body;ctx.beginPath();ctx.ellipse(-14,8,8,6,-.1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=d.body;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-16,4);ctx.lineTo(-20,-4+ls);ctx.stroke();ctx.beginPath();ctx.moveTo(-12,4);ctx.lineTo(-14,-4-ls);ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-20,-4+ls,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-14,-4-ls,2.5,0,Math.PI*2);ctx.fill();
}

// ── Main dispatch ──
function drawAnimalShape(a,isActive){
  const d=AD[a.name]||{body:'#888',accent:'#666',shape:'bear'};
  ctx.save();
  try{
    ctx.translate(a.x,a.y);
    if(a.dir<0)ctx.scale(-1,1);
    if(isActive){ctx.shadowColor='rgba(74,158,107,0.75)';ctx.shadowBlur=22;}
    switch(d.shape){
      case'cat':      drawCat(a,d);break;
      case'horse':    drawHorse(a,d);break;
      case'bear':     drawBear(a,d);break;
      case'elephant': drawElephant(a,d);break;
      case'giraffe':  drawGiraffe(a,d);break;
      case'croc':     drawCroc(a,d);break;
      case'rhino':    drawRhino(a,d);break;
      case'hippo':    drawHippo(a,d);break;
      case'camel':    drawCamel(a,d);break;
      case'pig':      drawPig(a,d);break;
      case'rabbit':   drawRabbit(a,d);break;
      case'gorilla':  drawGorilla(a,d);break;
      case'deer':     drawDeer(a,d);break;
      case'wolf':     drawWolf(a,d);break;
      case'fox':      drawFox(a,d);break;
      case'frog':     drawFrog(a,d);break;
      case'sloth':    drawSloth(a,d);break;
      case'lizard':   drawLizard(a,d);break;
      case'cow':      drawCow(a,d);break;
      case'goat':     drawGoat(a,d);break;
      case'sheep':    drawSheep(a,d);break;
      case'llama':    drawLlama(a,d);break;
      case'meerkat':  drawMeerkat(a,d);break;
      case'bison':    drawBison(a,d);break;
      case'warthog':  drawWarthog(a,d);break;
      case'hedgehog': drawHedgehog(a,d);break;
      case'badger':   drawBadger(a,d);break;
      case'raccoon':  drawRaccoon(a,d);break;
      case'beaver':   drawBeaver(a,d);break;
      case'otter':    drawOtter(a,d);break;
      case'squirrel': drawSquirrel(a,d);break;
      case'fish':     drawFish(a,d);break;
      case'bird':     drawBird(a,d);break;
      case'bird_walk':drawBirdWalk(a,d);break;
      case'flamingo': drawFlamingo(a,d);break;
      case'penguin':  drawPenguin(a,d);break;
      case'monkey':   drawMonkeyShape(a,d);break;
      case'octopus':  drawOctopus(a,d);break;
      case'jellyfish':drawJellyfish(a,d);break;
      case'crab':     drawCrab(a,d);break;
      case'seal':     drawSeal(a,d);break;
      case'snake':    drawSnake(a,d);break;
      case'butterfly':drawButterfly(a,d);break;
      case'bee':      drawBee(a,d);break;
      case'insect':   drawInsect(a,d);break;
      case'spider':   drawSpider(a,d);break;
      case'squid':    drawSquid(a,d);break;
      case'shrimp':   drawShrimp(a,d);break;
      case'snail':    drawSnail(a,d);break;
      default:        drawBear(a,d);break;
    }
  }finally{ctx.restore();}
  // name tag — always drawn even if shape threw
  ctx.save();
  try{
    ctx.font='11px system-ui';ctx.textAlign='center';
    const nw=ctx.measureText(a.name).width;
    const tagY=a.y+50;
    if(isActive){
      drawRoundRect(ctx,a.x-nw/2-8,tagY,nw+16,17,8);
      ctx.fillStyle='rgba(74,158,107,0.9)';ctx.fill();
      ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(a.name,a.x,tagY+8);
    } else {
      ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.textBaseline='top';
      ctx.strokeText(a.name,a.x,tagY);ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fillText(a.name,a.x,tagY);
    }
  }finally{ctx.restore();}
  if(isActive){
    const aiRect=currentSpeech?drawBubble(currentSpeech,a.x,a.y,false,null):null;
    if(userSpeech)drawBubble(userSpeech,a.x,a.y,true,aiRect);
  }
}

// ENVIRONMENT DRAWING
// ════════════════════════════════════════
function initSnow(w,h){
  if(snowflakes.length)return;
  for(let i=0;i<80;i++)snowflakes.push({x:Math.random()*w,y:Math.random()*h,r:1+Math.random()*3,spd:.4+Math.random()*.8,drift:(Math.random()-.5)*.4});
}
function updateSnow(w,h){
  snowflakes.forEach(s=>{s.y+=s.spd;s.x+=s.drift;if(s.y>h){s.y=-5;s.x=Math.random()*w;}if(s.x<0)s.x=w;if(s.x>w)s.x=0;});
}
function drawSnow(){
  ctx.fillStyle='rgba(255,255,255,0.85)';
  snowflakes.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
}

function initJungleTrees(w,h,gy){
  if(jungleTrees.length)return;
  const count=10;
  for(let i=0;i<count;i++){
    const xSeed=Math.sin(i*7.3+1)*0.5+0.5; // deterministic pseudo-random 0–1
    const tH=90+Math.floor(Math.sin(i*3.7)*1.5+1.5)*35; // 90–160
    const lR=42+Math.floor(Math.sin(i*2.1)*1.5+1.5)*16; // 42–90
    jungleTrees.push({
      x:50+xSeed*(w-100),
      trunkH:tH,
      branchY:gy-(tH*0.82),
      leafR:lR,
      // pre-compute vine anchor points
      vines:[
        {ox:-lR*.7, drop:gy-(tH*0.82)+lR*.3},
        {ox:lR*.5,  drop:gy-(tH*0.82)+lR*.5},
        {ox:-lR*.2, drop:gy-(tH*0.82)+lR*.65},
      ]
    });
  }
}

function drawJungleBackground(w,h,gy){
  // sky
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#9fdc72');sg.addColorStop(1,'#5aaa28');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#3a7520');gg.addColorStop(1,'#1e4510');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);

  // ── BACKGROUND HANGING VINES (from top, gentle sway) ──
  const vineFracs=[.05,.13,.24,.36,.50,.64,.76,.87,.95];
  ctx.lineCap='round';
  vineFracs.forEach((frac,i)=>{
    const vx=w*frac;
    const vlen=gy*(0.45+((i*41+7)%13)*0.04); // varied lengths, stays above ground
    const sway=Math.sin(_t*0.35+i*1.2)*7;
    ctx.strokeStyle='rgba(38,85,14,0.35)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(vx,0);
    ctx.quadraticCurveTo(vx+sway*0.5,vlen*0.5,vx+sway,vlen);
    ctx.stroke();
    // two leaves near midpoint
    ctx.fillStyle='rgba(50,110,18,0.38)';
    const lx=vx+sway*0.6,ly=vlen*0.6;
    ctx.beginPath();ctx.ellipse(lx-7,ly,9,4,-.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(lx+7,ly,9,4,.5,0,Math.PI*2);ctx.fill();
  });

  // ── TREES ──
  initJungleTrees(w,h,gy);
  jungleTrees.forEach(t=>{
    // trunk
    ctx.fillStyle='#4e342e';
    ctx.fillRect(t.x-8,gy-t.trunkH,16,t.trunkH);
    // branches
    ctx.strokeStyle='#3e2723';ctx.lineWidth=10;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x-t.leafR*.9,t.branchY+12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x+t.leafR*.9,t.branchY+12);ctx.stroke();
    ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(t.x,t.branchY);ctx.lineTo(t.x,t.branchY-14);ctx.stroke();
    // leaf canopy
    ctx.fillStyle='#2e7d32';ctx.beginPath();ctx.arc(t.x,t.branchY-t.leafR*.45,t.leafR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#388e3c';
    ctx.beginPath();ctx.ellipse(t.x-t.leafR*.8,t.branchY+10,t.leafR*.65,t.leafR*.4,-.28,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(t.x+t.leafR*.8,t.branchY+10,t.leafR*.65,t.leafR*.4,.28,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1b5e20';ctx.beginPath();ctx.arc(t.x,t.branchY-t.leafR*.7,t.leafR*.52,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(100,200,60,0.2)';ctx.beginPath();ctx.arc(t.x-t.leafR*.15,t.branchY-t.leafR*.55,t.leafR*.3,0,Math.PI*2);ctx.fill();
  });

  // ── HANGING VINES FROM TREE BRANCHES ──
  jungleTrees.forEach(t=>{
    t.vines.forEach((v,vi)=>{
      const sway=Math.sin(_t*0.45+vi*1.4+t.x*.004)*6;
      const sx=t.x+v.ox, sy=t.branchY+8;
      const ex=sx+sway, ey=v.drop;
      ctx.strokeStyle='#33691e';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sx+sway*.5,(sy+ey)/2,ex,ey);ctx.stroke();
      // leaf pair at middle
      ctx.fillStyle='#558b2f';
      const mx=sx+(ex-sx)*0.5,my=sy+(ey-sy)*0.5;
      ctx.beginPath();ctx.ellipse(mx-5,my,6,3,-.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(mx+5,my,6,3,.4,0,Math.PI*2);ctx.fill();
      // tip dot
      ctx.fillStyle='#2d5a1b';ctx.beginPath();ctx.arc(ex,ey,3,0,Math.PI*2);ctx.fill();
    });
  });
}

function drawOceanBackground(w,h){
  // fully underwater — no sky/ground split
  const og=ctx.createLinearGradient(0,0,0,h);
  og.addColorStop(0,'#0288d1');og.addColorStop(.5,'#01579b');og.addColorStop(1,'#001f3d');
  ctx.fillStyle=og;ctx.fillRect(0,0,w,h);
  // light rays from surface
  ctx.globalAlpha=.06;ctx.fillStyle='#fff';
  for(let i=0;i<8;i++){
    const rx=w*(.05+i*.13);
    ctx.beginPath();ctx.moveTo(rx-20,0);ctx.lineTo(rx+20,0);ctx.lineTo(rx+60,h*.5);ctx.lineTo(rx-40,h*.5);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
  // bubbles (static)
  ctx.fillStyle='rgba(255,255,255,0.2)';
  for(let i=0;i<30;i++){ctx.beginPath();ctx.arc((i*191+40)%w,(i*113+20)%(h*.7),1.5+(i%3),0,Math.PI*2);ctx.fill();}
  // seaweed
  for(let i=0;i<9;i++){
    const sx=40+i*(w-80)/8,sT=_t;
    ctx.strokeStyle='rgba(56,142,60,0.6)';ctx.lineWidth=5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,h);
    for(let j=4;j>=0;j--){ctx.lineTo(sx+Math.sin(sT+i+j)*14,h-j*22);}
    ctx.stroke();
  }
  // sandy floor
  const sfg=ctx.createLinearGradient(0,h*.82,0,h);
  sfg.addColorStop(0,'#c8a86b');sfg.addColorStop(1,'#9a7848');
  ctx.fillStyle=sfg;ctx.beginPath();
  ctx.moveTo(0,h*.82);
  for(let x=0;x<=w;x+=30){ctx.lineTo(x,h*.82+Math.sin(x*.05)*8);}
  ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  // coral
  const corals=[{x:w*.1,c:'#e91e63'},{x:w*.3,c:'#ff5722'},{x:w*.55,c:'#9c27b0'},{x:w*.75,c:'#e91e63'},{x:w*.9,c:'#ff5722'}];
  corals.forEach(({x,c})=>{
    ctx.strokeStyle=c;ctx.lineWidth=4;ctx.lineCap='round';
    for(let b=0;b<5;b++){const bx=x-20+b*10;ctx.beginPath();ctx.moveTo(bx,h*.82);ctx.lineTo(bx+Math.sin(b)*8,h*.82-30-b*5);ctx.stroke();ctx.beginPath();ctx.arc(bx+Math.sin(b)*8,h*.82-32-b*5,5,0,Math.PI*2);ctx.fill();}
  });
}

function drawDesertBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#fde48c');sg.addColorStop(1,'#f5a430');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  // ground
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#e8c550');gg.addColorStop(1,'#b89020');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // sun
  ctx.save();
  ctx.shadowColor='rgba(255,200,0,0.6)';ctx.shadowBlur=40;
  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(w*.82,gy*.22,52,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF176';ctx.beginPath();ctx.arc(w*.82,gy*.22,38,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // rolling dunes
  ctx.fillStyle='rgba(205,170,50,0.45)';
  ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,gy+30);
  ctx.bezierCurveTo(w*.15,gy-40,w*.28,gy-50,w*.4,gy+15);
  ctx.bezierCurveTo(w*.52,gy+55,w*.65,gy-30,w*.78,gy+10);
  ctx.bezierCurveTo(w*.9,gy+45,w,gy+20,w,gy+20);
  ctx.lineTo(w,h);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(180,145,30,0.3)';
  ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(0,gy+60);
  ctx.bezierCurveTo(w*.2,gy+20,w*.38,gy-20,w*.5,gy+40);
  ctx.bezierCurveTo(w*.62,gy+70,w*.8,gy+5,w,gy+30);
  ctx.lineTo(w,h);ctx.closePath();ctx.fill();
  // cacti
  [[w*.1,gy],[w*.35,gy],[w*.6,gy],[w*.82,gy]].forEach(([cx,cy])=>drawCactus(cx,cy));
}

function drawCactus(cx,gy){
  ctx.fillStyle='#4caf50';
  ctx.fillRect(cx-8,gy-60,16,60);
  ctx.fillRect(cx-28,gy-40,20,10);
  ctx.fillRect(cx+8,gy-35,20,10);
  ctx.fillRect(cx-28,gy-55,8,16);
  ctx.fillRect(cx+20,gy-48,8,14);
  ctx.fillStyle='#388e3c';
  ctx.fillRect(cx-6,gy-60,4,60);
}

function drawArcticBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#e8f5ff');sg.addColorStop(1,'#aad8f8');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#cce8ff');gg.addColorStop(1,'#88b8dc');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // aurora suggestion
  ctx.globalAlpha=.12;
  for(let i=0;i<4;i++){
    const ag=ctx.createLinearGradient(0,0,0,gy*.6);
    ag.addColorStop(0,'rgba(0,255,150,0)');ag.addColorStop(.5,`rgba(${i%2?'0,200,255':'100,255,100'},0.6)`);ag.addColorStop(1,'rgba(0,255,150,0)');
    ctx.fillStyle=ag;ctx.fillRect(w*.1+i*(w*.22),0,w*.2,gy*.6);
  }
  ctx.globalAlpha=1;
  // jagged ice formations
  const iceGroups=[{x:w*.05,n:7,h:55},{x:w*.28,n:6,h:70},{x:w*.5,n:8,h:45},{x:w*.72,n:6,h:65},{x:w*.88,n:7,h:55}];
  iceGroups.forEach(({x,n,h:ih})=>{
    ctx.fillStyle='rgba(200,235,255,0.85)';
    ctx.beginPath();ctx.moveTo(x-n*8,gy);
    for(let i=0;i<=n;i++){const px=x-n*8+i*(n*16/n);ctx.lineTo(px+(i%2===0?4:-4),gy-(i%2===0?ih:ih*.5+(Math.sin(i*7.3+n)*5+5)));}
    ctx.lineTo(x+n*8,gy);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(220,245,255,0.5)';
    ctx.beginPath();ctx.moveTo(x-n*6,gy);
    for(let i=0;i<=n-1;i++){const px=x-n*6+i*(n*12/(n-1));ctx.lineTo(px,gy-(i%2===0?ih*.6:ih*.2));}
    ctx.lineTo(x+n*6,gy);ctx.closePath();ctx.fill();
  });
  // horizontal ice lines
  ctx.strokeStyle='rgba(155,205,240,0.35)';ctx.lineWidth=1.5;
  [gy+12,gy+26].forEach(ly=>{ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(w,ly);ctx.stroke();});
  // snow
  initSnow(w,h);updateSnow(w,h);drawSnow();
}

function drawSavannaBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#fce07a');sg.addColorStop(1,'#e8901e');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#c8a030');gg.addColorStop(1,'#8c6818');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // grass tufts
  ctx.strokeStyle='rgba(155,120,18,0.35)';ctx.lineWidth=1.5;
  for(let i=0;i<38;i++){const gx=(i*137)%w;ctx.beginPath();ctx.moveTo(gx,gy+5);ctx.lineTo(gx-6,gy-20);ctx.moveTo(gx,gy+5);ctx.lineTo(gx+6,gy-22);ctx.moveTo(gx,gy+5);ctx.lineTo(gx,gy-15);ctx.stroke();}
  // acacia tree
  ctx.fillStyle='rgba(75,45,18,0.3)';ctx.fillRect(w*.85,gy-75,10,78);
  ctx.fillStyle='rgba(55,85,28,0.3)';ctx.beginPath();ctx.ellipse(w*.85+5,gy-75,50,16,0,0,Math.PI*2);ctx.fill();
}

function drawForestBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#b0d898');sg.addColorStop(1,'#609858');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#3a6828');gg.addColorStop(1,'#1e4015');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  for(let i=0;i<7;i++){const tx=25+i*(w/6.2),th=80+(i%3)*35,tw=14+(i%2)*4;ctx.fillStyle='rgba(55,35,15,0.22)';ctx.fillRect(tx-tw/2,gy-th,tw,th+8);ctx.fillStyle='rgba(35,75,28,0.27)';ctx.beginPath();ctx.arc(tx,gy-th,30+(i%2)*12,0,Math.PI*2);ctx.fill();}
}

function drawFarmBackground(w,h,gy){
  const sg=ctx.createLinearGradient(0,0,0,gy);
  sg.addColorStop(0,'#90d4f8');sg.addColorStop(1,'#5ab4ec');
  ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
  const gg=ctx.createLinearGradient(0,gy,0,h);
  gg.addColorStop(0,'#7acc40');gg.addColorStop(1,'#4aa020');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,w,h-gy);
  // silo (left of barn)
  ctx.fillStyle='#b0b8c8';ctx.beginPath();ctx.ellipse(w*.77,gy*.4,w*.018,w*.018,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#c8d0de';ctx.fillRect(w*.752,gy*.4,w*.036,gy*.58);
  ctx.fillStyle='#8a9ab0';ctx.beginPath();ctx.ellipse(w*.77,gy*.4,w*.018,w*.01,0,0,Math.PI*2);ctx.fill();
  // barn walls
  ctx.fillStyle='#c0392b';ctx.fillRect(w*.79,gy*.38,w*.16,gy*.59);
  // barn roof
  ctx.fillStyle='#7b1a0e';
  ctx.beginPath();ctx.moveTo(w*.775,gy*.38);ctx.lineTo(w*.87,gy*.18);ctx.lineTo(w*.965,gy*.38);ctx.closePath();ctx.fill();
  // roof ridge highlight
  ctx.strokeStyle='#a02010';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(w*.775,gy*.38);ctx.lineTo(w*.87,gy*.18);ctx.lineTo(w*.965,gy*.38);ctx.stroke();
  // barn door (big double door)
  ctx.fillStyle='#6b2a10';
  ctx.fillRect(w*.845,gy*.62,w*.04,gy*.35);
  ctx.fillStyle='#7d3318';ctx.fillRect(w*.845,gy*.62,w*.019,gy*.35);
  ctx.strokeStyle='#4a1a08';ctx.lineWidth=1.5;
  ctx.strokeRect(w*.845,gy*.62,w*.04,gy*.35);
  ctx.beginPath();ctx.moveTo(w*.865,gy*.62);ctx.lineTo(w*.865,gy*.97);ctx.stroke();
  // door handles
  ctx.fillStyle='#f0c040';ctx.beginPath();ctx.arc(w*.861,gy*.795,w*.004,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(w*.869,gy*.795,w*.004,0,Math.PI*2);ctx.fill();
  // barn windows (left & right of door)
  [w*.802,w*.91].forEach(wx=>{
    ctx.fillStyle='#a8d4f0';ctx.fillRect(wx,gy*.5,w*.028,gy*.2);
    ctx.strokeStyle='#4a2a10';ctx.lineWidth=2;ctx.strokeRect(wx,gy*.5,w*.028,gy*.2);
    ctx.beginPath();ctx.moveTo(wx+w*.014,gy*.5);ctx.lineTo(wx+w*.014,gy*.7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(wx,gy*.6);ctx.lineTo(wx+w*.028,gy*.6);ctx.stroke();
  });
  // white barn X cross on door
  ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.globalAlpha=0.3;
  ctx.beginPath();ctx.moveTo(w*.845,gy*.62);ctx.lineTo(w*.885,gy*.97);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*.885,gy*.62);ctx.lineTo(w*.845,gy*.97);ctx.stroke();
  ctx.globalAlpha=1;
  // white trim stripe on barn
  ctx.strokeStyle='#ffffff';ctx.lineWidth=3;ctx.globalAlpha=0.5;
  ctx.strokeRect(w*.79,gy*.38,w*.16,gy*.59);
  ctx.globalAlpha=1;
  // weather vane on roof peak
  ctx.strokeStyle='#f0c040';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(w*.87,gy*.18);ctx.lineTo(w*.87,gy*.10);ctx.stroke();
  ctx.fillStyle='#f0c040';
  ctx.beginPath();ctx.moveTo(w*.87,gy*.10);ctx.lineTo(w*.862,gy*.13);ctx.lineTo(w*.878,gy*.13);ctx.closePath();ctx.fill();
  // pen fences (5 pens)
  const penW=w/5;
  ctx.strokeStyle='rgba(160,120,60,0.7)';ctx.lineWidth=3;
  // horizontal rails
  [gy+10,gy+26].forEach(ry=>{ctx.beginPath();ctx.moveTo(0,ry);ctx.lineTo(w,ry);ctx.stroke();});
  // vertical posts
  for(let i=0;i<=5;i++){const px=i*penW;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,gy-5);ctx.lineTo(px,gy+32);ctx.stroke();}
  // pen labels
  ctx.fillStyle='rgba(100,75,35,0.4)';ctx.font='10px system-ui';ctx.textAlign='center';
  for(let i=0;i<5;i++){ctx.fillText('Pen '+(i+1),(i+.5)*penW,gy+42);}
}

function drawFullBackground(world){
  const w=canvas.width,h=canvas.height,gy=h*.62;
  switch(world.envId){
    case'ocean':   drawOceanBackground(w,h);break;
    case'jungle':  drawJungleBackground(w,h,gy);break;
    case'desert':  drawDesertBackground(w,h,gy);break;
    case'arctic':  drawArcticBackground(w,h,gy);break;
    case'savanna': drawSavannaBackground(w,h,gy);break;
    case'forest':  drawForestBackground(w,h,gy);break;
    case'farm':    drawFarmBackground(w,h,gy);break;
    default:{
      const sg=ctx.createLinearGradient(0,0,0,gy);sg.addColorStop(0,'#b0d898');sg.addColorStop(1,'#609858');
      ctx.fillStyle=sg;ctx.fillRect(0,0,w,gy);
      ctx.fillStyle='#3a6828';ctx.fillRect(0,gy,w,h-gy);
    }
  }
}

// ════════════════════════════════════════
// MOVEMENT
// ════════════════════════════════════════
function updateAnimals(world){
  const cw=canvas.width,ch=canvas.height;
  const gy=ch*.62;
  const groundY=gy-30;
  const skyMin=ch*.08,skyMax=ch*.42;
  const waterMid=ch*.48,waterMin=ch*.3,waterMax=ch*.7;
  const floorY=ch*.83;
  const driftMin=ch*.15,driftMax=ch*.38;

  world.animals.forEach(a=>{
    // ── Occasional animal voice ──
    const now=Date.now();
    if(!a.soundTimer)a.soundTimer=now+3000+Math.random()*9000; // first sound 3-12s after spawn
    if(now>=a.soundTimer){
      if(!a.chatting)playAnimalSound(a.name);
      a.soundTimer=now+10000+Math.random()*14000; // next sound in 10-24s
    }
    if(a.chatting)return;
    a.phase+=0.025*gameSpeed;
    a.x+=a.vx*gameSpeed;

    // Pen boundaries for farm animals
    if(world.envId==='farm'){
      const penW=cw/5;
      const pIdx=(a.penIndex||0)%5;
      const penL=pIdx*penW+18,penR=penL+penW-36;
      if(a.x<penL){a.x=penL;a.vx=Math.abs(a.vx);a.dir=1;}
      if(a.x>penR){a.x=penR;a.vx=-Math.abs(a.vx);a.dir=-1;}
      a.y=groundY+Math.sin(a.phase*3)*4;
      return;
    }

    switch(a.moveType){
      case'fly':
        a.y=(skyMin+skyMax)/2+Math.sin(a.phase)*(skyMax-skyMin)*.38;
        break;
      case'swim':
        if(world.envId==='ocean'){a.y=waterMid+Math.sin(a.phase*.8)*90;}
        else{a.y=(ch*.65+ch*.87)/2+Math.sin(a.phase*.7)*26;}
        break;
      case'floor':
        a.y=floorY+Math.sin(a.phase*4)*4;
        break;
      case'drift':
        a.y=driftMin+(driftMax-driftMin)*.5+Math.sin(a.phase*.6)*(driftMax-driftMin)*.4;
        a.vx*=0.998; // gentle drift
        break;
      case'swing':
        // monkey swings between jungle tree branches
        if(world.envId==='jungle'){
          initJungleTrees(cw,ch,gy);
          if(!a.swingTarget||Math.abs(a.x-a.swingTarget.x)<30){
            const others=jungleTrees.filter(t=>t.x!==a.swingTarget?.x);
            a.swingTarget=others[Math.floor(Math.random()*others.length)]||jungleTrees[0];
            const dx=a.swingTarget.x-a.x;a.vx=Math.sign(dx)*(0.8+Math.random()*.5);a.dir=Math.sign(dx)||1;
          }
          a.y=(a.swingTarget?.branchY||gy-100)+Math.sin(a.phase*2)*12;
        } else {
          a.y=(skyMin+skyMax)/2+Math.sin(a.phase)*30;
        }
        break;
      default:
        a.y=groundY+Math.sin(a.phase*3)*5;
    }

    const margin=70;
    if(a.x<margin){a.x=margin;a.vx=Math.abs(a.vx);a.dir=1;}
    if(a.x>cw-margin){a.x=cw-margin;a.vx=-Math.abs(a.vx);a.dir=-1;}
  });
}

// WORLD TABS + MAIN DRAW
// ════════════════════════════════════════
function drawWorldTabs(){
  const ch=canvas.height;
  worlds.forEach((world,i)=>{
    const tx=TAB_MARGIN+i*(TAB_W+TAB_GAP),ty=ch-TAB_H-TAB_MARGIN;
    const isActive=world.id===activeWorldId;
    ctx.save();ctx.shadowColor='rgba(0,0,0,0.28)';ctx.shadowBlur=8;
    drawRoundRect(ctx,tx,ty,TAB_W,TAB_H,10);
    ctx.fillStyle=isActive?'rgba(74,158,107,0.94)':'rgba(0,0,0,0.52)';ctx.fill();
    ctx.shadowBlur=0;ctx.font='20px serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(ENV_ICONS[world.envId]||'🌍',tx+8,ty+TAB_H/2);
    ctx.font='10px system-ui';ctx.fillStyle='#fff';ctx.textAlign='left';
    const label=world.envLabel||'New Group';
    ctx.fillText(label.length>9?label.slice(0,9):label,tx+32,ty+TAB_H/2);
    // ── Trash delete button (top-right corner circle) ──
    const trashX=tx+TAB_W,trashY=ty;
    ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=5;
    ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(trashX,trashY,11,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.font='12px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🗑',trashX,trashY+1);
    ctx.restore();
  });
  const bx=TAB_MARGIN+worlds.length*(TAB_W+TAB_GAP),by=canvas.height-TAB_H-TAB_MARGIN;
  ctx.save();ctx.shadowColor='rgba(0,0,0,0.2)';ctx.shadowBlur=6;
  drawRoundRect(ctx,bx,by,NEW_BTN_W,TAB_H,10);
  ctx.fillStyle=pendingNewWorld?'rgba(74,158,107,0.9)':'rgba(255,255,255,0.22)';ctx.fill();
  ctx.shadowBlur=0;ctx.font='bold 20px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('+',bx+NEW_BTN_W/2,by+TAB_H/2);ctx.restore();
}

function drawAnimals(){
  const world=getActiveWorld();
  if(!world){
    ctx.fillStyle='#f0ede6';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.save();ctx.font='bold 18px system-ui';ctx.fillStyle='#aaa';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Drag an animal to get started!',canvas.width/2,canvas.height/2-14);
    ctx.font='13px system-ui';ctx.fillStyle='#bbb';
    ctx.fillText('Each environment gets its own world',canvas.width/2,canvas.height/2+14);
    ctx.restore();drawWorldTabs();return;
  }
  // Draw background — errors here must NEVER prevent animals from rendering
  try{
    if(world.envId){drawFullBackground(world);}
    else{ctx.fillStyle='#c8c4be';ctx.fillRect(0,0,canvas.width,canvas.height);}
  }catch(bgErr){
    ctx.fillStyle='#2d5a1b';ctx.fillRect(0,0,canvas.width,canvas.height);
    console.warn('BG draw error:',bgErr);
  }
  // Reset transform so a corrupted background state can't misplace animals
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.shadowColor='transparent';ctx.shadowBlur=0;
  ctx.globalCompositeOperation='source-over';
  updateAnimals(world);
  world.animals.forEach(a=>{
    // Hard-reset state before EVERY animal so a previous draw error can't corrupt the next one
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha=1;
    ctx.shadowColor='transparent';ctx.shadowBlur=0;
    ctx.globalCompositeOperation='source-over';
    // Purple delete-mode highlight
    if(deleteMode&&hoveredDeleteAnimal&&hoveredDeleteAnimal.id===a.id){
      ctx.beginPath();ctx.arc(a.x,a.y,52,0,Math.PI*2);
      ctx.fillStyle='rgba(139,0,255,0.15)';ctx.fill();
      ctx.strokeStyle='rgba(139,0,255,0.7)';ctx.lineWidth=3;ctx.stroke();
      ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.shadowColor='transparent';ctx.shadowBlur=0;
    }
    try{drawAnimalShape(a,activeChatAnimal&&activeChatAnimal.id===a.id);}
    catch(ae){console.warn('Animal draw error:',a.name,ae);}
  });
  ctx.setTransform(1,0,0,1,0,0);
  drawWorldTabs();
}

function loop(){_t+=0.016;drawAnimals();requestAnimationFrame(loop);}
loop();
