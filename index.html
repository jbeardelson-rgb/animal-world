<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, sans-serif; }

    #layout { display: flex; width: 100%; height: 100%; }

    /* ── Game area ── */
    #game-area { flex: 1; position: relative; min-width: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      background: rgba(255,255,255,0.95);
      z-index: 30;
      transition: opacity 0.2s;
    }
    #loading-overlay.hidden { display: none; }
    #loading-emoji { font-size: 80px; animation: wiggle 1.1s ease-in-out infinite; display: block; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-12deg) scale(1); }
      25%      { transform: rotate(12deg) scale(1.12); }
      50%      { transform: rotate(-6deg) scale(1); }
      75%      { transform: rotate(6deg) scale(1.06); }
    }
    #loading-text { font-size: 18px; font-weight: 600; color: #333; }
    #loading-sub  { font-size: 13px; color: #888; }
    #loading-dots { display: flex; gap: 10px; margin-top: 6px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      animation: dotJump 0.75s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: #ff6b6b; animation-delay: 0s; }
    .dot:nth-child(2) { background: #ffd93d; animation-delay: 0.15s; }
    .dot:nth-child(3) { background: #6bcb77; animation-delay: 0.30s; }
    @keyframes dotJump {
      0%,100% { transform: translateY(0) scale(1); }
      45%     { transform: translateY(-20px) scale(1.25); }
    }

    /* ── Speech bar ── */
    #speech-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 40px));
      display: flex; align-items: center; gap: 10px;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 32px;
      padding: 10px 10px 10px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      z-index: 20;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #speech-bar.hidden { display: none; }
    #speech-bar:focus-within {
      border-color: #4a9e6b;
      box-shadow: 0 4px 24px rgba(74,158,107,0.15);
    }
    #chat-input {
      flex: 1; border: none; outline: none;
      font-size: 15px; font-family: inherit;
      background: transparent; color: #222;
      min-width: 0;
    }
    #chat-input::placeholder { color: #aaa; }
    #chat-send {
      background: #4a9e6b; color: #fff; border: none;
      border-radius: 50%; width: 36px; height: 36px;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; line-height: 1;
    }
    #chat-send:hover { background: #3a8a5a; }
    #chat-send:disabled { background: #ccc; cursor: not-allowed; }
    #close-chat-btn {
      background: none; border: none; cursor: pointer;
      font-size: 18px; color: #bbb; flex-shrink: 0;
      line-height: 1; padding: 2px 4px; border-radius: 50%;
    }
    #close-chat-btn:hover { color: #888; background: #f0f0ec; }

    /* ── Toggle button ── */
    #toggle-btn {
      position: fixed; top: 50%; right: 270px;
      transform: translateY(-50%);
      width: 18px; height: 52px;
      background: #f0f0ec; border: 1px solid #ddddd8;
      border-left: none; border-radius: 0 6px 6px 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: right 0.25s ease, background 0.15s;
      color: #888; font-size: 10px; user-select: none;
    }
    #toggle-btn:hover { background: #e2e2de; color: #444; }
    #toggle-btn.panel-collapsed { right: 0; }

    /* ── Right panel ── */
    #panel {
      width: 270px; height: 100%;
      background: #f7f7f5; border-left: 1px solid #e0e0dc;
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: width 0.25s ease, opacity 0.25s ease; overflow: hidden;
    }
    #panel.collapsed { width: 0; opacity: 0; border-left: none; }
    #panel-inner { width: 270px; height: 100%; display: flex; flex-direction: column; }

    /* ── Env strip ── */
    #env-strip-wrap { padding: 12px 0 0; background: #f7f7f5; border-bottom: 1px solid #e0e0dc; flex-shrink: 0; }
    #env-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scroll-behavior: smooth; scrollbar-width: none; }
    #env-strip::-webkit-scrollbar { display: none; }
    .env-btn {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 8px 10px; border-radius: 10px;
      border: 1.5px solid transparent; background: #fff;
      cursor: pointer; transition: all 0.15s ease; font-size: 11px; color: #666; font-weight: 500;
    }
    .env-btn .icon { font-size: 22px; }
    .env-btn:hover { background: #eee; }
    .env-btn.active { border-color: #4a9e6b; background: #edf7f1; color: #2e7d50; }

    /* ── Animals grid ── */
    #animals-area { flex: 1; overflow-y: auto; padding: 14px 12px; scrollbar-width: thin; scrollbar-color: #ddd transparent; }
    #env-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 10px; }
    #animals-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .animal-card {
      background: #fff; border: 1px solid #e4e4e0; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 6px 8px; gap: 4px; cursor: grab;
      transition: all 0.12s ease; user-select: none;
    }
    .animal-card:hover { border-color: #4a9e6b; background: #f4fbf7; transform: scale(1.04); }
    .animal-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .animal-card .emoji { font-size: 26px; line-height: 1; pointer-events: none; }
    .animal-card .name  { font-size: 10px; color: #888; font-weight: 500; text-align: center; line-height: 1.2; pointer-events: none; }

    /* Drop hint */
    #drop-hint {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      border: 3px dashed #4a9e6b; border-radius: 0; opacity: 0;
      transition: opacity 0.15s; background: rgba(74,158,107,0.04);
      display: flex; align-items: center; justify-content: center;
    }
    #drop-hint.active { opacity: 1; }
    #drop-hint span { font-size: 16px; color: #4a9e6b; font-weight: 600; background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 20px; }
  </style>
</head>
<body>

<div id="layout">
  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="drop-hint"><span>Drop animal here!</span></div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="hidden">
      <span id="loading-emoji"></span>
      <div id="loading-text"></div>
      <div id="loading-sub">Getting ready to chat!</div>
      <div id="loading-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Speech bar -->
    <div id="speech-bar" class="hidden">
      <button id="close-chat-btn" title="Stop chatting">✕</button>
      <input id="chat-input" type="text" placeholder="Say something..." maxlength="200" />
      <button id="chat-send">&#x279C;</button>
    </div>
  </div>

  <button id="toggle-btn" title="Toggle panel">&#x276F;</button>

  <div id="panel">
    <div id="panel-inner">
      <div id="env-strip-wrap">
        <div id="env-strip"></div>
      </div>
      <div id="animals-area">
        <div id="env-label"></div>
        <div id="animals-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
const ENV_SCENES = {
  jungle:  { sky1:'#c0eda0', sky2:'#70b840', gnd1:'#4e8c28', gnd2:'#2a5a0e' },
  ocean:   { sky1:'#90d8f8', sky2:'#3aabdc', gnd1:'#1870c8', gnd2:'#084888' },
  desert:  { sky1:'#fde48c', sky2:'#f5a430', gnd1:'#e8c550', gnd2:'#b89020' },
  arctic:  { sky1:'#e8f5ff', sky2:'#aad8f8', gnd1:'#cce8ff', gnd2:'#88b8dc' },
  savanna: { sky1:'#fce07a', sky2:'#e8901e', gnd1:'#c8a030', gnd2:'#8c6818' },
  forest:  { sky1:'#b0d898', sky2:'#609858', gnd1:'#3a6828', gnd2:'#1e4015' },
  farm:    { sky1:'#90d4f8', sky2:'#5ab4ec', gnd1:'#7acc40', gnd2:'#4aa020' },
};
// ── World system ──
let worlds = [], activeWorldId = null, worldIdCounter = 0, animalIdCounter = 0, pendingNewWorld = null;
const ENV_ICONS = { jungle:'🌿', ocean:'🌊', desert:'🏜️', arctic:'🧊', savanna:'🦁', forest:'🌲', farm:'🌾' };
const FLY_NAMES  = new Set(['Macaw','Butterfly','Snowy Owl','Snow Bunting','Dove','Crow','Bee','Vulture','Sec. Bird','Swan','Duck','Rooster','Chicken','Turkey','Flamingo','Peacock']);
const SWIM_NAMES = new Set(['Shark','Dolphin','Octopus','Whale','Clownfish','Jellyfish','Squid','Shrimp','Blowfish','Tuna','Narwhal','Seal','Otter']);
function getMoveType(name) { return FLY_NAMES.has(name) ? 'fly' : SWIM_NAMES.has(name) ? 'swim' : 'walk'; }
function getActiveWorld() { return worlds.find(w => w.id === activeWorldId) || null; }
function createWorld(envId, envLabel) { const w={id:worldIdCounter++,envId,envLabel,animals:[]}; worlds.push(w); activeWorldId=w.id; return w; }
const TAB_H=40, TAB_W=90, TAB_GAP=6, TAB_MARGIN=12, NEW_BTN_W=46;

const BAD_WORDS = ['fuck','shit','bitch','ass','damn','crap','bastard','dick','cock','pussy','cunt','piss','hell','wtf','stfu','idiot','stupid','hate','kill','die','ugly'];

function hasBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => new RegExp('\\b' + w + '\\b').test(lower));
}

// ════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
let activeChatAnimal = null;

function resize() {
  const area = document.getElementById('game-area');
  canvas.width  = area.clientWidth;
  canvas.height = area.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ════════════════════════════════════════
// ANIMALS ON CANVAS
// ════════════════════════════════════════
let currentSpeech = '', userSpeech = '';

function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBubble(text, ax, ay, isUser) {
  if (!text) return;
  const pad = 14, lh = 22, maxW = 230, r = 14, tailH = 14;
  ctx.font = '14px system-ui';
  const lines = wrapText(ctx, text, maxW);
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2;
  const bh = lines.length * lh + pad * 2;

  const emojiR = 30;
  let bx, by;
  if (isUser) {
    bx = ax - bw / 2;
    by = ay + emojiR + 8;
  } else {
    bx = ax - bw / 2;
    by = ay - emojiR - bh - 8;
  }

  bx = Math.max(8, Math.min(canvas.width - bw - 8, bx));
  by = Math.max(8, Math.min(canvas.height - bh - 8, by));

  const tailX = Math.max(bx + 20, Math.min(bx + bw - 20, ax));

  ctx.shadowColor = 'rgba(0,0,0,0.10)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;

  drawRoundRect(ctx, bx, by, bw, bh, r);
  ctx.fillStyle = isUser ? '#4a9e6b' : '#ffffff';
  ctx.fill();
  ctx.strokeStyle = isUser ? '#3a8a5a' : '#e0e0dc';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  ctx.beginPath();
  if (isUser) {
    ctx.moveTo(tailX - 8, by);
    ctx.lineTo(tailX, ay + emojiR + 2);
    ctx.lineTo(tailX + 8, by);
  } else {
    ctx.moveTo(tailX - 8, by + bh);
    ctx.lineTo(tailX, ay - emojiR - 2);
    ctx.lineTo(tailX + 8, by + bh);
  }
  ctx.fillStyle = isUser ? '#4a9e6b' : '#ffffff';
  ctx.fill();

  ctx.font = '14px system-ui';
  ctx.fillStyle = isUser ? '#fff' : '#222';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh));
}

// ── (card details removed — animals now roam freely) ──
function drawCardEnvDetails(envId, x, y, w, h, gy) {
  ctx.save();
  switch (envId) {
    case 'jungle':
      ctx.fillStyle = 'rgba(50,110,15,0.45)';
      [{lx:x+4,s:14},{lx:x+w-18,s:16},{lx:x+w/2-9,s:12}].forEach(({lx,s}) => {
        ctx.beginPath(); ctx.ellipse(lx+s/2, gy-s*0.4, s*0.4, s*0.65, -0.4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(lx+s/2+6, gy-s*0.3, s*0.35, s*0.6, 0.4, 0, Math.PI*2); ctx.fill();
      });
      break;
    case 'ocean':
      ctx.strokeStyle = 'rgba(255,255,255,0.38)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const wy = gy + 5 + i * 8;
        ctx.beginPath();
        for (let wx = x; wx <= x+w; wx += 3) {
          const wh = Math.sin((wx-x)*0.22 + i*1.5) * 2.5;
          wx === x ? ctx.moveTo(wx, wy+wh) : ctx.lineTo(wx, wy+wh);
        }
        ctx.stroke();
      }
      break;
    case 'desert':
      ctx.fillStyle = 'rgba(200,165,40,0.35)';
      ctx.beginPath();
      ctx.moveTo(x, gy+h*0.1); ctx.quadraticCurveTo(x+w*0.3, gy-h*0.12, x+w*0.5, gy+h*0.05);
      ctx.quadraticCurveTo(x+w*0.72, gy+h*0.18, x+w, gy+h*0.04);
      ctx.lineTo(x+w, gy); ctx.lineTo(x, gy); ctx.closePath(); ctx.fill();
      break;
    case 'arctic':
      ctx.fillStyle = 'rgba(255,255,255,0.68)';
      for (let i = 0; i < 10; i++) {
        ctx.beginPath(); ctx.arc(x+8+(i*(w-16)/9), y+6+(i%3)*9, 1.5+(i%3)*0.5, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(180,220,255,0.45)'; ctx.lineWidth = 1.5;
      [gy+8, gy+18].forEach(iy => { ctx.beginPath(); ctx.moveTo(x,iy); ctx.lineTo(x+w,iy); ctx.stroke(); });
      break;
    case 'savanna':
      ctx.strokeStyle = 'rgba(165,125,20,0.45)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 14; i++) {
        const gx = x+5+i*(w-10)/13;
        ctx.beginPath(); ctx.moveTo(gx,gy+3); ctx.lineTo(gx-3,gy-9); ctx.moveTo(gx,gy+3); ctx.lineTo(gx+3,gy-11); ctx.stroke();
      }
      break;
    case 'forest':
      [[x+2,20,8],[x+w-10,17,7]].forEach(([tx,th,tw]) => {
        ctx.fillStyle = 'rgba(55,35,15,0.35)'; ctx.fillRect(tx, gy-th, tw, th+5);
        ctx.fillStyle = 'rgba(35,75,25,0.4)'; ctx.beginPath(); ctx.arc(tx+tw/2, gy-th, tw+6, 0, Math.PI*2); ctx.fill();
      });
      break;
    case 'farm':
      ctx.strokeStyle = 'rgba(175,135,70,0.55)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x, gy+5); ctx.lineTo(x+w, gy+5); ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const fx = x+4+i*(w-8)/4;
        ctx.beginPath(); ctx.moveTo(fx, gy-8); ctx.lineTo(fx, gy+9); ctx.stroke();
      }
      ctx.fillStyle = '#ff8888';
      [{fx:x+20},{fx:x+w*0.5},{fx:x+w-22}].forEach(({fx}) => { ctx.beginPath(); ctx.arc(fx, gy+2, 3, 0, Math.PI*2); ctx.fill(); });
      break;
  }
  ctx.restore();
}

// ── Full-canvas environment details ──
function drawFullEnvDetails(envId, w, h, gy) {
  ctx.save();
  switch (envId) {
    case 'jungle':
      ctx.fillStyle = 'rgba(45,105,15,0.3)';
      for (let i = 0; i < 8; i++) {
        const lx = 20+i*(w/7.5), s = 32+i%3*12;
        ctx.beginPath(); ctx.ellipse(lx, gy-s*0.4, s*0.38, s*0.65, -0.4+i*0.15, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(lx+s*0.6, gy-s*0.3, s*0.32, s*0.58, 0.3-i*0.1, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(55,110,20,0.2)'; ctx.lineWidth = 4;
      for (let i = 0; i < 5; i++) {
        const vx = w*0.08+i*(w*0.22);
        ctx.beginPath(); ctx.moveTo(vx,0); ctx.quadraticCurveTo(vx+25,h*0.28,vx-12,h*0.5); ctx.stroke();
      }
      break;
    case 'ocean':
      for (let row = 0; row < 6; row++) {
        const wy = gy+12+row*((h-gy-10)/6);
        ctx.strokeStyle = `rgba(255,255,255,${0.22-row*0.025})`; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let wx = 0; wx <= w; wx += 5) {
          const wh = Math.sin(wx*0.035+row*1.2)*9; wx===0?ctx.moveTo(wx,wy+wh):ctx.lineTo(wx,wy+wh);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let i = 0; i < 18; i++) {
        ctx.beginPath(); ctx.arc((i*191+50)%w, gy+20+(i*97)%(h-gy-25), 2+(i%3)*0.8, 0, Math.PI*2); ctx.fill();
      }
      break;
    case 'desert':
      ctx.fillStyle = 'rgba(205,170,45,0.3)';
      ctx.beginPath(); ctx.moveTo(0,gy+25);
      ctx.quadraticCurveTo(w*0.22,gy-50,w*0.42,gy+12); ctx.quadraticCurveTo(w*0.62,gy+55,w*0.78,gy+8);
      ctx.quadraticCurveTo(w*0.9,gy-35,w,gy+18); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,195,90,0.12)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const sy = gy*0.3+i*gy*0.085;
        ctx.beginPath();
        for (let sx = 0; sx <= w; sx += 6) {
          const sh = Math.sin(sx*0.055+i*0.9)*5; sx===0?ctx.moveTo(sx,sy+sh):ctx.lineTo(sx,sy+sh);
        }
        ctx.stroke();
      }
      break;
    case 'arctic':
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 50; i++) {
        ctx.beginPath(); ctx.arc((i*191+30)%w, (i*113+10)%(gy*0.9), 0.8+(i%4)*0.6, 0, Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(155,205,240,0.38)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(0,gy+14+i*20); ctx.lineTo(w,gy+14+i*20); ctx.stroke(); }
      ctx.fillStyle = 'rgba(200,230,255,0.35)';
      [{px:w*0.1,pw:60,ph:35},{px:w*0.7,pw:80,ph:45},{px:w*0.45,pw:50,ph:28}].forEach(({px,pw,ph}) => {
        ctx.beginPath(); ctx.moveTo(px-pw/2,gy); ctx.lineTo(px,gy-ph); ctx.lineTo(px+pw/2,gy); ctx.closePath(); ctx.fill();
      });
      break;
    case 'savanna':
      ctx.strokeStyle = 'rgba(155,120,18,0.3)'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 35; i++) {
        const gx = (i*137)%w;
        ctx.beginPath(); ctx.moveTo(gx,gy+5); ctx.lineTo(gx-6,gy-18); ctx.moveTo(gx,gy+5); ctx.lineTo(gx+6,gy-22); ctx.moveTo(gx,gy+5); ctx.lineTo(gx,gy-14); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(75,45,18,0.28)'; ctx.fillRect(w*0.84, gy-70, 10, 75);
      ctx.fillStyle = 'rgba(55,85,28,0.28)'; ctx.beginPath(); ctx.ellipse(w*0.84+5, gy-72, 42, 14, 0, 0, Math.PI*2); ctx.fill();
      break;
    case 'forest':
      for (let i = 0; i < 7; i++) {
        const tx = 25+i*(w/6.2), th = 80+(i%3)*35, tw = 14+(i%2)*4;
        ctx.fillStyle = 'rgba(55,35,15,0.22)'; ctx.fillRect(tx-tw/2, gy-th, tw, th+8);
        ctx.fillStyle = 'rgba(35,75,28,0.27)'; ctx.beginPath(); ctx.arc(tx, gy-th, 30+(i%2)*12, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(35,72,22,0.25)';
      for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.ellipse(i*(w/8), gy+10, 28, 14, 0, 0, Math.PI*2); ctx.fill(); }
      break;
    case 'farm':
      ctx.strokeStyle = 'rgba(175,135,70,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0,gy+14); ctx.lineTo(w,gy+14); ctx.stroke();
      ctx.lineWidth = 2;
      for (let i = 0; i <= Math.ceil(w/42)+1; i++) {
        const fx = i*42; ctx.beginPath(); ctx.moveTo(fx,gy-18); ctx.lineTo(fx,gy+20); ctx.stroke();
      }
      ctx.fillStyle = '#ff8080';
      for (let i = 0; i < 20; i++) { ctx.beginPath(); ctx.arc((i*157+20)%w, gy+6+(i%3)*10, 3, 0, Math.PI*2); ctx.fill(); }
      break;
  }
  ctx.restore();
}

// ── Full canvas background ──
function drawFullBackground(envId) {
  const w = canvas.width, h = canvas.height;
  const sc = ENV_SCENES[envId] || ENV_SCENES.forest;
  const gy = h * 0.62;

  const skyGrad = ctx.createLinearGradient(0, 0, 0, gy);
  skyGrad.addColorStop(0, sc.sky1); skyGrad.addColorStop(1, sc.sky2);
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, gy);

  const gndGrad = ctx.createLinearGradient(0, gy, 0, h);
  gndGrad.addColorStop(0, sc.gnd1); gndGrad.addColorStop(1, sc.gnd2);
  ctx.fillStyle = gndGrad; ctx.fillRect(0, gy, w, h - gy);

  drawFullEnvDetails(envId, w, h, gy);
}

// ════════════════════════════════════════
// ANIMAL MOVEMENT + FREE DRAWING
// ════════════════════════════════════════
function updateAnimals(world) {
  const cw = canvas.width, ch = canvas.height;
  const groundY = ch * 0.62 - 28;
  const skyMin = ch * 0.08, skyMax = ch * 0.46;
  const waterMin = ch * 0.65, waterMax = ch * 0.87;
  world.animals.forEach(a => {
    if (a.chatting) return;
    a.phase += 0.025;
    a.x += a.vx;
    switch (a.moveType) {
      case 'fly':
        a.y = (skyMin + skyMax) / 2 + Math.sin(a.phase) * (skyMax - skyMin) * 0.38;
        break;
      case 'swim':
        a.y = (waterMin + waterMax) / 2 + Math.sin(a.phase * 0.7) * 26;
        break;
      default:
        a.y = groundY + Math.sin(a.phase * 3) * 5;
    }
    const margin = 65;
    if (a.x < margin) { a.x = margin; a.vx = Math.abs(a.vx); a.dir = 1; }
    if (a.x > cw - margin) { a.x = cw - margin; a.vx = -Math.abs(a.vx); a.dir = -1; }
  });
}

function drawAnimalFree(a, isActive) {
  // Emoji (flipped for direction)
  ctx.save();
  ctx.translate(a.x, a.y);
  if (a.dir < 0) ctx.scale(-1, 1);
  if (isActive) { ctx.shadowColor = 'rgba(74,158,107,0.7)'; ctx.shadowBlur = 22; }
  ctx.font = '52px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.emoji, 0, 0);
  ctx.restore();

  // Name tag (always upright)
  ctx.save();
  ctx.font = '11px system-ui';
  ctx.textAlign = 'center';
  const nw = ctx.measureText(a.name).width;
  if (isActive) {
    drawRoundRect(ctx, a.x - nw/2 - 8, a.y + 30, nw + 16, 17, 8);
    ctx.fillStyle = 'rgba(74,158,107,0.9)'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    ctx.fillText(a.name, a.x, a.y + 38);
  } else {
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.textBaseline = 'top';
    ctx.strokeText(a.name, a.x, a.y + 30);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(a.name, a.x, a.y + 30);
  }
  ctx.restore();

  if (isActive) {
    if (userSpeech)   drawBubble(userSpeech,   a.x, a.y, true);
    if (currentSpeech) drawBubble(currentSpeech, a.x, a.y, false);
  }
}

function drawWorldTabs() {
  const ch = canvas.height;
  worlds.forEach((world, i) => {
    const tx = TAB_MARGIN + i * (TAB_W + TAB_GAP);
    const ty = ch - TAB_H - TAB_MARGIN;
    const isActive = world.id === activeWorldId;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.28)'; ctx.shadowBlur = 8;
    drawRoundRect(ctx, tx, ty, TAB_W, TAB_H, 10);
    ctx.fillStyle = isActive ? 'rgba(74,158,107,0.94)' : 'rgba(0,0,0,0.52)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.font = '20px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(ENV_ICONS[world.envId] || '🌍', tx + 8, ty + TAB_H / 2);
    ctx.font = '10px system-ui'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    const label = world.envLabel || 'New Group';
    ctx.fillText(label.length > 9 ? label.slice(0, 9) : label, tx + 32, ty + TAB_H / 2);
    ctx.restore();
  });
  // "New Group" button
  const bx = TAB_MARGIN + worlds.length * (TAB_W + TAB_GAP);
  const by = ch - TAB_H - TAB_MARGIN;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 6;
  drawRoundRect(ctx, bx, by, NEW_BTN_W, TAB_H, 10);
  ctx.fillStyle = pendingNewWorld ? 'rgba(74,158,107,0.9)' : 'rgba(255,255,255,0.22)';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('+', bx + NEW_BTN_W / 2, by + TAB_H / 2);
  ctx.restore();
}

function drawAnimals() {
  const world = getActiveWorld();
  if (!world) {
    ctx.fillStyle = '#f0ede6'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.font = 'bold 18px system-ui'; ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Drag an animal to get started!', canvas.width / 2, canvas.height / 2 - 14);
    ctx.font = '13px system-ui'; ctx.fillStyle = '#bbb';
    ctx.fillText('Each environment gets its own world', canvas.width / 2, canvas.height / 2 + 14);
    ctx.restore();
    drawWorldTabs();
    return;
  }
  if (world.envId) {
    drawFullBackground(world.envId);
  } else {
    ctx.fillStyle = '#c8c4be'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.font = 'bold 16px system-ui'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('New group — drop an animal here!', canvas.width / 2, canvas.height / 2);
    ctx.restore();
  }
  updateAnimals(world);
  world.animals.forEach(a => drawAnimalFree(a, activeChatAnimal && activeChatAnimal.id === a.id));
  drawWorldTabs();
}

function loop() { drawAnimals(); requestAnimationFrame(loop); }
loop();

// ════════════════════════════════════════
// DRAG & DROP
// ════════════════════════════════════════
let dragPayload = null;
const dropHint  = document.getElementById('drop-hint');
const gameArea  = document.getElementById('game-area');

gameArea.addEventListener('dragover', e => {
  e.preventDefault();
  dropHint.classList.add('active');
});
gameArea.addEventListener('dragleave', e => {
  if (!gameArea.contains(e.relatedTarget)) dropHint.classList.remove('active');
});
gameArea.addEventListener('drop', e => {
  e.preventDefault();
  dropHint.classList.remove('active');
  if (!dragPayload) return;
  const rect  = canvas.getBoundingClientRect();
  const dropX = (e.clientX - rect.left) * (canvas.width / rect.width);
  const cw = canvas.width, ch = canvas.height;

  // Find or create matching world
  let world = getActiveWorld();
  if (!world) {
    world = createWorld(dragPayload.envId, dragPayload.envLabel);
  } else if (world.envId === null) {
    // blank pending world — assign env from first animal
    world.envId = dragPayload.envId;
    world.envLabel = dragPayload.envLabel;
    pendingNewWorld = null;
  } else if (world.envId !== dragPayload.envId) {
    // Different env — find existing world for this env or create new one
    let existing = worlds.find(w => w.envId === dragPayload.envId);
    if (existing) { activeWorldId = existing.id; world = existing; }
    else { world = createWorld(dragPayload.envId, dragPayload.envLabel); }
  }

  const moveType = getMoveType(dragPayload.name);
  let startY;
  if (moveType === 'fly')       startY = ch * 0.22 + Math.random() * ch * 0.18;
  else if (moveType === 'swim') startY = ch * 0.68 + Math.random() * ch * 0.14;
  else                          startY = ch * 0.62 - 26;

  const spd = 0.7 + Math.random() * 1.3;
  const dir = Math.random() < 0.5 ? 1 : -1;
  world.animals.push({
    id: animalIdCounter++,
    emoji: dragPayload.emoji, name: dragPayload.name,
    envId: dragPayload.envId, envLabel: dragPayload.envLabel,
    x: Math.max(80, Math.min(cw - 80, dropX)), y: startY,
    vx: spd * dir, phase: Math.random() * Math.PI * 2,
    moveType, dir, chatting: false,
  });
  dragPayload = null;
});

// ════════════════════════════════════════
// CLICK ANIMAL ON CANVAS
// ════════════════════════════════════════
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width  / rect.width);
  const my = (e.clientY - rect.top)  * (canvas.height / rect.height);
  const ch = canvas.height;
  const tabY = ch - TAB_H - TAB_MARGIN;

  // Tab bar region
  if (my >= tabY) {
    // World tabs
    for (let i = 0; i < worlds.length; i++) {
      const tx = TAB_MARGIN + i * (TAB_W + TAB_GAP);
      if (mx >= tx && mx <= tx + TAB_W) {
        if (activeChatAnimal) { activeChatAnimal.chatting = false; activeChatAnimal = null; }
        activeWorldId = worlds[i].id;
        currentSpeech = ''; userSpeech = '';
        speechBar.classList.add('hidden');
        return;
      }
    }
    // New Group button
    const bx = TAB_MARGIN + worlds.length * (TAB_W + TAB_GAP);
    if (mx >= bx && mx <= bx + NEW_BTN_W) {
      if (!pendingNewWorld) {
        pendingNewWorld = { id: worldIdCounter++, envId: null, envLabel: 'New Group', animals: [] };
        worlds.push(pendingNewWorld);
      }
      if (activeChatAnimal) { activeChatAnimal.chatting = false; activeChatAnimal = null; }
      activeWorldId = pendingNewWorld.id;
      currentSpeech = ''; userSpeech = '';
      speechBar.classList.add('hidden');
    }
    return;
  }

  // Animal clicks
  const world = getActiveWorld();
  if (!world) return;
  for (const a of world.animals) {
    const dx = mx - a.x, dy = my - a.y;
    if (Math.sqrt(dx*dx + dy*dy) < 38) { openChat(a); return; }
  }

  // Background click — close chat
  if (activeChatAnimal) {
    activeChatAnimal.chatting = false;
    activeChatAnimal = null;
    currentSpeech = ''; userSpeech = '';
    speechBar.classList.add('hidden');
  }
});

// ════════════════════════════════════════
// CHAT
// ════════════════════════════════════════
const loadingOverlay = document.getElementById('loading-overlay');
const loadingEmoji   = document.getElementById('loading-emoji');
const loadingText    = document.getElementById('loading-text');
const speechBar      = document.getElementById('speech-bar');
const chatInput      = document.getElementById('chat-input');
const chatSend       = document.getElementById('chat-send');
const closeChatBtn   = document.getElementById('close-chat-btn');

let conversations = {};
let isSending     = false;

function buildSystemPrompt(animal) {
  return `You are ${animal.name}, a friendly and lovable ${animal.name} who lives in the ${animal.envLabel}. You love chatting with kids and families!

RULES — follow these every single response, no exceptions:
- Stay fully in character as a real ${animal.name}
- Keep ALL responses 100% family-friendly and suitable for young children (ages 4+)
- Keep responses SHORT and fun — 2 to 3 sentences maximum
- If anyone uses bad language, swear words, or says anything unkind, reply with something like: "Oops! Let's keep things nice and friendly! 🌟" and change the subject to something fun
- Share fun facts about being a ${animal.name} naturally
- Occasionally use animal sounds or expressions a ${animal.name} might make
- Never discuss violence, adult topics, scary things, or anything inappropriate
- Be warm, playful, and encouraging at all times`;
}

async function openChat(animal) {
  activeChatAnimal = animal;
  animal.chatting = true;
  loadingEmoji.textContent = animal.emoji;
  loadingText.textContent  = `Waking up ${animal.name}...`;
  loadingOverlay.classList.remove('hidden');

  if (conversations[animal.id]) {
    loadingOverlay.classList.add('hidden');
    showChatUI(animal);
    return;
  }

  conversations[animal.id] = [];
  currentSpeech = '';
  userSpeech    = '';

  try {
    const greeting = await callAPI(animal, [{ role: 'user', content: `Hi! I just placed you in my world. Say a fun greeting as ${animal.name}!` }]);
    conversations[animal.id].push(
      { role: 'user',      content: `Hi! I just placed you in my world. Say a fun greeting as ${animal.name}!` },
      { role: 'assistant', content: greeting }
    );
    currentSpeech = greeting;
    loadingOverlay.classList.add('hidden');
    showChatUI(animal);
  } catch(err) {
    loadingOverlay.classList.add('hidden');
    alert('Could not connect. Please try again.');
    animal.chatting = false;
    activeChatAnimal = null;
  }
}

function showChatUI(animal) {
  speechBar.classList.remove('hidden');
  chatInput.focus();
}

async function sendMessage() {
  if (!activeChatAnimal || isSending) return;
  const text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = '';
  isSending = true;
  chatSend.disabled = true;

  userSpeech = hasBadWord(text) ? '[message filtered]' : text;

  const userContent = hasBadWord(text) ? '[message filtered]' : text;
  conversations[activeChatAnimal.id].push({ role: 'user', content: userContent });

  try {
    const reply = await callAPI(activeChatAnimal, conversations[activeChatAnimal.id]);
    conversations[activeChatAnimal.id].push({ role: 'assistant', content: reply });
    currentSpeech = reply;
  } catch(e) {
    const fallback = "Oops, I lost my voice for a second! Try again? 🐾";
    conversations[activeChatAnimal.id].push({ role: 'assistant', content: fallback });
    currentSpeech = fallback;
  }

  isSending = false;
  chatSend.disabled = false;
  chatInput.focus();
}

async function callAPI(animal, messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemPrompt: buildSystemPrompt(animal),
      messages,
    }),
  });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return data.reply;
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

closeChatBtn.addEventListener('click', () => {
  if (activeChatAnimal) { activeChatAnimal.chatting = false; activeChatAnimal = null; }
  currentSpeech = '';
  userSpeech = '';
  speechBar.classList.add('hidden');
});
