<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; font-family: system-ui, sans-serif; }

    #layout { display: flex; width: 100%; height: 100%; }

    /* ── Game area ── */
    #game-area { flex: 1; position: relative; min-width: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    /* ── Loading overlay ── */
    #loading-overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      background: rgba(255,255,255,0.95);
      z-index: 30;
      transition: opacity 0.2s;
    }
    #loading-overlay.hidden { display: none; }
    #loading-emoji { font-size: 80px; animation: wiggle 1.1s ease-in-out infinite; display: block; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-12deg) scale(1); }
      25%      { transform: rotate(12deg) scale(1.12); }
      50%      { transform: rotate(-6deg) scale(1); }
      75%      { transform: rotate(6deg) scale(1.06); }
    }
    #loading-text { font-size: 18px; font-weight: 600; color: #333; }
    #loading-sub  { font-size: 13px; color: #888; }
    #loading-dots { display: flex; gap: 10px; margin-top: 6px; }
    .dot {
      width: 14px; height: 14px; border-radius: 50%;
      animation: dotJump 0.75s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: #ff6b6b; animation-delay: 0s; }
    .dot:nth-child(2) { background: #ffd93d; animation-delay: 0.15s; }
    .dot:nth-child(3) { background: #6bcb77; animation-delay: 0.30s; }
    @keyframes dotJump {
      0%,100% { transform: translateY(0) scale(1); }
      45%     { transform: translateY(-20px) scale(1.25); }
    }

    /* ── Speech bar ── */
    #speech-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: min(560px, calc(100% - 40px));
      display: flex; align-items: center; gap: 10px;
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 32px;
      padding: 10px 10px 10px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      z-index: 20;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #speech-bar.hidden { display: none; }
    #speech-bar:focus-within {
      border-color: #4a9e6b;
      box-shadow: 0 4px 24px rgba(74,158,107,0.15);
    }
    #chat-input {
      flex: 1; border: none; outline: none;
      font-size: 15px; font-family: inherit;
      background: transparent; color: #222;
      min-width: 0;
    }
    #chat-input::placeholder { color: #aaa; }
    #chat-send {
      background: #4a9e6b; color: #fff; border: none;
      border-radius: 50%; width: 36px; height: 36px;
      font-size: 16px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; line-height: 1;
    }
    #chat-send:hover { background: #3a8a5a; }
    #chat-send:disabled { background: #ccc; cursor: not-allowed; }
    #close-chat-btn {
      background: none; border: none; cursor: pointer;
      font-size: 18px; color: #bbb; flex-shrink: 0;
      line-height: 1; padding: 2px 4px; border-radius: 50%;
    }
    #close-chat-btn:hover { color: #888; background: #f0f0ec; }

    /* ── Toggle button ── */
    #toggle-btn {
      position: fixed; top: 50%; right: 270px;
      transform: translateY(-50%);
      width: 18px; height: 52px;
      background: #f0f0ec; border: 1px solid #ddddd8;
      border-left: none; border-radius: 0 6px 6px 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 100; transition: right 0.25s ease, background 0.15s;
      color: #888; font-size: 10px; user-select: none;
    }
    #toggle-btn:hover { background: #e2e2de; color: #444; }
    #toggle-btn.panel-collapsed { right: 0; }

    /* ── Right panel ── */
    #panel {
      width: 270px; height: 100%;
      background: #f7f7f5; border-left: 1px solid #e0e0dc;
      display: flex; flex-direction: column; flex-shrink: 0;
      transition: width 0.25s ease, opacity 0.25s ease; overflow: hidden;
    }
    #panel.collapsed { width: 0; opacity: 0; border-left: none; }
    #panel-inner { width: 270px; height: 100%; display: flex; flex-direction: column; }

    /* ── Env strip ── */
    #env-strip-wrap { padding: 12px 0 0; background: #f7f7f5; border-bottom: 1px solid #e0e0dc; flex-shrink: 0; }
    #env-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scroll-behavior: smooth; scrollbar-width: none; }
    #env-strip::-webkit-scrollbar { display: none; }
    .env-btn {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center;
      gap: 4px; padding: 8px 10px; border-radius: 10px;
      border: 1.5px solid transparent; background: #fff;
      cursor: pointer; transition: all 0.15s ease; font-size: 11px; color: #666; font-weight: 500;
    }
    .env-btn .icon { font-size: 22px; }
    .env-btn:hover { background: #eee; }
    .env-btn.active { border-color: #4a9e6b; background: #edf7f1; color: #2e7d50; }

    /* ── Animals grid ── */
    #animals-area { flex: 1; overflow-y: auto; padding: 14px 12px; scrollbar-width: thin; scrollbar-color: #ddd transparent; }
    #env-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 10px; }
    #animals-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .animal-card {
      background: #fff; border: 1px solid #e4e4e0; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px 6px 8px; gap: 4px; cursor: grab;
      transition: all 0.12s ease; user-select: none;
    }
    .animal-card:hover { border-color: #4a9e6b; background: #f4fbf7; transform: scale(1.04); }
    .animal-card.dragging { opacity: 0.4; transform: scale(0.95); }
    .animal-card .emoji { font-size: 26px; line-height: 1; pointer-events: none; }
    .animal-card .name  { font-size: 10px; color: #888; font-weight: 500; text-align: center; line-height: 1.2; pointer-events: none; }

    /* Drop hint */
    #drop-hint {
      position: absolute; inset: 0; pointer-events: none; z-index: 5;
      border: 3px dashed #4a9e6b; border-radius: 0; opacity: 0;
      transition: opacity 0.15s; background: rgba(74,158,107,0.04);
      display: flex; align-items: center; justify-content: center;
    }
    #drop-hint.active { opacity: 1; }
    #drop-hint span { font-size: 16px; color: #4a9e6b; font-weight: 600; background: rgba(255,255,255,0.9); padding: 8px 16px; border-radius: 20px; }
  </style>
</head>
<body>

<div id="layout">
  <div id="game-area">
    <canvas id="canvas"></canvas>
    <div id="drop-hint"><span>Drop animal here!</span></div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="hidden">
      <span id="loading-emoji"></span>
      <div id="loading-text"></div>
      <div id="loading-sub">Getting ready to chat!</div>
      <div id="loading-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Speech bar -->
    <div id="speech-bar" class="hidden">
      <button id="close-chat-btn" title="Stop chatting">✕</button>
      <input id="chat-input" type="text" placeholder="Say something..." maxlength="200" />
      <button id="chat-send">&#x279C;</button>
    </div>
  </div>

  <button id="toggle-btn" title="Toggle panel">&#x276F;</button>

  <div id="panel">
    <div id="panel-inner">
      <div id="env-strip-wrap">
        <div id="env-strip"></div>
      </div>
      <div id="animals-area">
        <div id="env-label"></div>
        <div id="animals-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════
const ENV_COLORS = {
  jungle:  '#d4edda', ocean:  '#cce5ff', desert: '#fff3cd',
  arctic:  '#d1ecf1', savanna:'#fef3c7', forest: '#d4edda',
  farm:    '#fefce8',
};

const BAD_WORDS = ['fuck','shit','bitch','ass','damn','crap','bastard','dick','cock','pussy','cunt','piss','hell','wtf','stfu','idiot','stupid','hate','kill','die','ugly'];

function hasBadWord(text) {
  const lower = text.toLowerCase();
  return BAD_WORDS.some(w => lower.includes(w));
}

// ════════════════════════════════════════
// CANVAS
// ════════════════════════════════════════
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
let activeChatAnimal = null;

function resize() {
  const area = document.getElementById('game-area');
  canvas.width  = area.clientWidth;
  canvas.height = area.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ════════════════════════════════════════
// ANIMALS ON CANVAS
// ════════════════════════════════════════
let canvasAnimals = [];
let animalIdCounter = 0;

let currentSpeech = '';
let userSpeech    = '';
let userSpeechTimer = null;

function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawBubble(text, ax, ay, isUser) {
  if (!text) return;
  const pad = 14, lh = 22, maxW = 230, r = 14, tailH = 14;
  ctx.font = '14px system-ui';
  const lines = wrapText(ctx, text, maxW);
  const bw = Math.max(...lines.map(l => ctx.measureText(l).width)) + pad * 2;
  const bh = lines.length * lh + pad * 2;

  let bx, by;
  if (isUser) {
    bx = ax - bw / 2;
    by = ay + 54;
  } else {
    bx = ax - bw / 2;
    by = ay - 54 - bh - tailH;
  }

  bx = Math.max(8, Math.min(canvas.width - bw - 8, bx));
  by = Math.max(8, Math.min(canvas.height - bh - 8, by));

  const tailX = Math.max(bx + 20, Math.min(bx + bw - 20, ax));

  ctx.shadowColor = 'rgba(0,0,0,0.10)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;

  drawRoundRect(ctx, bx, by, bw, bh, r);
  ctx.fillStyle = isUser ? '#4a9e6b' : '#ffffff';
  ctx.fill();
  ctx.strokeStyle = isUser ? '#3a8a5a' : '#e0e0dc';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  ctx.beginPath();
  if (isUser) {
    ctx.moveTo(tailX - 8, by);
    ctx.lineTo(tailX, ay + 50);
    ctx.lineTo(tailX + 8, by);
  } else {
    ctx.moveTo(tailX - 8, by + bh);
    ctx.lineTo(tailX, ay - 50);
    ctx.lineTo(tailX + 8, by + bh);
  }
  ctx.fillStyle = isUser ? '#4a9e6b' : '#ffffff';
  ctx.fill();

  ctx.font = '14px system-ui';
  ctx.fillStyle = isUser ? '#fff' : '#222';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad + i * lh));
}

function drawAnimals() {
  const bgColor = activeChatAnimal ? ENV_COLORS[activeChatAnimal.envId] : '#ffffff';
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  canvasAnimals.forEach(a => {
    const isActive = activeChatAnimal && activeChatAnimal.id === a.id;
    const r = 38;

    if (isActive) {
      ctx.beginPath();
      ctx.arc(a.x, a.y, r + 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(74,158,107,0.18)';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = isActive ? '#4a9e6b' : '#ddddd8';
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.stroke();

    ctx.font = '30px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(a.emoji, a.x, a.y);

    ctx.font = '11px system-ui';
    ctx.fillStyle = isActive ? '#2e7d50' : '#777';
    ctx.textBaseline = 'top';
    ctx.fillText(a.name, a.x, a.y + r + 5);
    if (!isActive) {
      ctx.font = '10px system-ui';
      ctx.fillStyle = '#bbb';
      ctx.fillText('tap to chat', a.x, a.y + r + 20);
    }

    if (isActive) {
      if (userSpeech) drawBubble(userSpeech, a.x, a.y, true);
      if (currentSpeech) drawBubble(currentSpeech, a.x, a.y, false);
    }
  });
}

function loop() { drawAnimals(); requestAnimationFrame(loop); }
loop();

// ════════════════════════════════════════
// DRAG & DROP
// ════════════════════════════════════════
let dragPayload = null;
const dropHint  = document.getElementById('drop-hint');
const gameArea  = document.getElementById('game-area');

gameArea.addEventListener('dragover', e => {
  e.preventDefault();
  dropHint.classList.add('active');
});
gameArea.addEventListener('dragleave', e => {
  if (!gameArea.contains(e.relatedTarget)) dropHint.classList.remove('active');
});
gameArea.addEventListener('drop', e => {
  e.preventDefault();
  dropHint.classList.remove('active');
  if (!dragPayload) return;
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top)  * scaleY;
  canvasAnimals.push({
    id: animalIdCounter++,
    x, y,
    emoji:    dragPayload.emoji,
    name:     dragPayload.name,
    envId:    dragPayload.envId,
    envLabel: dragPayload.envLabel,
  });
  dragPayload = null;
});

// ════════════════════════════════════════
// CLICK ANIMAL ON CANVAS
// ════════════════════════════════════════
canvas.addEventListener('click', e => {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;

  for (const a of canvasAnimals) {
    const dx = mx - a.x, dy = my - a.y;
    if (Math.sqrt(dx*dx + dy*dy) < 44) {
      openChat(a);
      return;
    }
  }
});

// ════════════════════════════════════════
// CHAT
// ════════════════════════════════════════
const loadingOverlay = document.getElementById('loading-overlay');
const loadingEmoji   = document.getElementById('loading-emoji');
const loadingText    = document.getElementById('loading-text');
const speechBar      = document.getElementById('speech-bar');
const chatInput      = document.getElementById('chat-input');
const chatSend       = document.getElementById('chat-send');
const closeChatBtn   = document.getElementById('close-chat-btn');

let conversations = {};
let isSending     = false;

function buildSystemPrompt(animal) {
  return `You are ${animal.name}, a friendly and lovable ${animal.name} who lives in the ${animal.envLabel}. You love chatting with kids and families!

RULES — follow these every single response, no exceptions:
- Stay fully in character as a real ${animal.name}
- Keep ALL responses 100% family-friendly and suitable for young children (ages 4+)
- Keep responses SHORT and fun — 2 to 3 sentences maximum
- If anyone uses bad language, swear words, or says anything unkind, reply with something like: "Oops! Let's keep things nice and friendly! 🌟" and change the subject to something fun
- Share fun facts about being a ${animal.name} naturally
- Occasionally use animal sounds or expressions a ${animal.name} might make
- Never discuss violence, adult topics, scary things, or anything inappropriate
- Be warm, playful, and encouraging at all times`;
}

async function openChat(animal) {
  activeChatAnimal = animal;
  loadingEmoji.textContent = animal.emoji;
  loadingText.textContent  = `Waking up ${animal.name}...`;
  loadingOverlay.classList.remove('hidden');

  if (conversations[animal.id]) {
    loadingOverlay.classList.add('hidden');
    showChatUI(animal);
    return;
  }

  conversations[animal.id] = [];
  currentSpeech = '';
  userSpeech    = '';

  try {
    const greeting = await callAPI(animal, [{ role: 'user', content: `Hi! I just placed you in my world. Say a fun greeting as ${animal.name}!` }]);
    conversations[animal.id].push(
      { role: 'user',      content: `Hi! I just placed you in my world. Say a fun greeting as ${animal.name}!` },
      { role: 'assistant', content: greeting }
    );
    currentSpeech = greeting;
    loadingOverlay.classList.add('hidden');
    showChatUI(animal);
  } catch(err) {
    loadingOverlay.classList.add('hidden');
    alert('Could not connect. Please try again.');
    activeChatAnimal = null;
  }
}

function showChatUI(animal) {
  speechBar.classList.remove('hidden');
  chatInput.focus();
}

async function sendMessage() {
  if (!activeChatAnimal || isSending) return;
  const text = chatInput.value.trim();
  if (!text) return;

  chatInput.value = '';
  isSending = true;
  chatSend.disabled = true;

  userSpeech = hasBadWord(text) ? '[message filtered]' : text;

  const userContent = hasBadWord(text) ? '[message filtered]' : text;
  conversations[activeChatAnimal.id].push({ role: 'user', content: userContent });

  try {
    const reply = await callAPI(activeChatAnimal, conversations[activeChatAnimal.id]);
    conversations[activeChatAnimal.id].push({ role: 'assistant', content: reply });
    currentSpeech = reply;
  } catch(e) {
    const fallback = "Oops, I lost my voice for a second! Try again? 🐾";
    conversations[activeChatAnimal.id].push({ role: 'assistant', content: fallback });
    currentSpeech = fallback;
  }

  isSending = false;
  chatSend.disabled = false;
  chatInput.focus();
}

async function callAPI(animal, messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemPrompt: buildSystemPrompt(animal),
      messages,
    }),
  });
  if (!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return data.reply;
}

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

closeChatBtn.addEventListener('click', () => {
  activeChatAnimal = null;
  currentSpeech = '';
  userSpeech = '';
  speechBar.classList.add('hidden');
});

// ════════════════════════════════════════
// PANEL DATA
// ════════════════════════════════════════
const environments = [
  { id:'jungle',  label:'Jungle',  icon:'🌿', animals:[
    {name:'Gorilla',emoji:'🦍'},{name:'Tree Frog',emoji:'🐸'},{name:'Sloth',emoji:'🦥'},
    {name:'Macaw',emoji:'🦜'},{name:'Monkey',emoji:'🐒'},{name:'Butterfly',emoji:'🦋'},
    {name:'Crocodile',emoji:'🐊'},{name:'Tiger',emoji:'🐅'},{name:'Tarantula',emoji:'🕷️'},
    {name:'Leopard',emoji:'🐆'},{name:'Anaconda',emoji:'🐍'},{name:'Peacock',emoji:'🦚'},
  ]},

    {name:'Whale',emoji:'🐋'},{name:'Clownfish',emoji:'🐠'},{name:'Jellyfish',emoji:'🪼'},

  { id:'forest',  label:'Forest',  icon:'🌲', animals:[

    {name:'Otter',emoji:'🦦'},{name:'Squirrel',emoji:'🐿️'},{name:'Bobcat',emoji:'🐈'},

];

// ── Build env strip ──
let activeEnv = environments[0].id;
const strip = document.getElementById('env-strip');
environments.forEach(env => {
  const btn = document.createElement('button');
  btn.className = 'env-btn' + (env.id === activeEnv ? ' active' : '');
  btn.dataset.id = env.id;
  btn.innerHTML = `<span class="icon">${env.icon}</span><span>${env.label}</span>`;
  btn.addEventListener('click', () => selectEnv(env.id));
  strip.appendChild(btn);
});

function selectEnv(id) {
  activeEnv = id;
  document.querySelectorAll('.env-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  const env = environments.find(e => e.id === id);
  document.getElementById('env-label').textContent = env.label + ' Animals';
  const grid = document.getElementById('animals-grid');
  grid.innerHTML = '';
  env.animals.forEach(animal => {
    const card = document.createElement('div');
    card.className = 'animal-card';
    card.draggable = true;
    card.innerHTML = `<span class="emoji">${animal.emoji}</span><span class="name">${animal.name}</span>`;
    card.addEventListener('dragstart', (e) => {
      dragPayload = { emoji: animal.emoji, name: animal.name, envId: env.id, envLabel: env.label };
      card.classList.add('dragging');
      const dc = document.createElement('canvas');
      dc.width = 90; dc.height = 90;
      const dx = dc.getContext('2d');
      dx.beginPath(); dx.arc(45,45,42,0,Math.PI*2);
      dx.fillStyle = '#fff'; dx.fill();
      dx.strokeStyle = '#4a9e6b'; dx.lineWidth = 3; dx.stroke();
      dx.font = '42px serif'; dx.textAlign = 'center'; dx.textBaseline = 'middle';
      dx.fillText(animal.emoji, 45, 45);
      e.dataTransfer.setDragImage(dc, 45, 45);
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    grid.appendChild(card);
  });
}
selectEnv(activeEnv);

// ── Collapse toggle ──
const panel     = document.getElementById('panel');
const toggleBtn = document.getElementById('toggle-btn');
let collapsed   = false;

toggleBtn.addEventListener('click', () => {
  collapsed = !collapsed;
  panel.classList.toggle('collapsed', collapsed);
  toggleBtn.classList.toggle('panel-collapsed', collapsed);
  toggleBtn.innerHTML = collapsed ? '&#x276E;' : '&#x276F;';
  setTimeout(resize, 260);
});
</script>
