// DRAG & DROP
// ════════════════════════════════════════
let dragPayload=null;
let deleteMode=false,hoveredDeleteAnimal=null;
function setDeleteMode(on){
  deleteMode=on;
  if(!on){hoveredDeleteAnimal=null;canvas.style.cursor='';}
  const btn=document.getElementById('delete-mode-btn');
  btn.classList.toggle('active',on);
  btn.textContent=on?'✓ Done Deleting':'✂ Delete an Animal';
  canvas.style.cursor=on?'crosshair':'';
}
const dropHint=document.getElementById('drop-hint');
const gameArea=document.getElementById('game-area');

gameArea.addEventListener('dragover',e=>{e.preventDefault();dropHint.classList.add('active');});
gameArea.addEventListener('dragleave',e=>{if(!gameArea.contains(e.relatedTarget))dropHint.classList.remove('active');});
gameArea.addEventListener('drop',e=>{
  e.preventDefault();dropHint.classList.remove('active');
  if(!dragPayload)return;
  ensureAudio();
  const rect=canvas.getBoundingClientRect();
  const dropX=(e.clientX-rect.left)*(canvas.width/rect.width);
  const cw=canvas.width,ch=canvas.height;

  let world=getActiveWorld();
  if(!world)world=createWorld(dragPayload.envId,dragPayload.envLabel);
  else if(world.envId===null){world.envId=dragPayload.envId;world.envLabel=dragPayload.envLabel;pendingNewWorld=null;}
  else if(world.envId!==dragPayload.envId){
    // Different biome — switch to that biome's world (or create one)
    let ex=worlds.find(w=>w.envId===dragPayload.envId);
    if(ex){activeWorldId=ex.id;world=ex;}
    else world=createWorld(dragPayload.envId,dragPayload.envLabel);
    // Reset jungle trees if switching away from/to jungle so scene re-initialises
    jungleTrees=[];
  }

  // Max 12 animals per world
  if(world.animals.length>=12){dragPayload=null;showSpawnLimit();return;}

  let mt=getMoveType(dragPayload.name);
  if(world.envId==='farm')mt='walk';

  const gy=ch*.62;
  let startY;
  if(mt==='fly')startY=ch*.22+Math.random()*ch*.18;
  else if(mt==='swim')startY=ch*.48+Math.random()*ch*.22;
  else if(mt==='floor')startY=ch*.83;
  else if(mt==='drift')startY=ch*.2+Math.random()*ch*.18;
  else startY=gy-30;

  const spd=0.7+Math.random()*1.3,dir=Math.random()<.5?1:-1;
  // Place animal safely within the canvas — clamp to 15–85% width so it never hides in a corner
  const safeX=Math.max(cw*0.15,Math.min(cw*0.85,dropX));
  const farmAnimals=world.animals.filter(a=>world.envId==='farm').length;

  world.animals.push({
    id:animalIdCounter++,emoji:dragPayload.emoji,name:dragPayload.name,
    envId:dragPayload.envId,envLabel:dragPayload.envLabel,
    x:safeX,y:startY,
    vx:spd*dir,phase:Math.random()*Math.PI*2,
    moveType:mt,dir,chatting:false,
    penIndex:world.envId==='farm'?farmAnimals:0,
  });
  dragPayload=null;
});

// ════════════════════════════════════════
// CLICK ANIMAL ON CANVAS
// ════════════════════════════════════════
canvas.addEventListener('click',e=>{
  ensureAudio();
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const ch=canvas.height,tabY=ch-TAB_H-TAB_MARGIN;

  // ── "… more" expand button ──
  if(moreButtonRect){
    const b=moreButtonRect;
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){bubbleExpanded=!bubbleExpanded;return;}
  }

  // ── Trash button check (circle overlaps tab corner — checked before tabY gate) ──
  for(let i=0;i<worlds.length;i++){
    const tx=TAB_MARGIN+i*(TAB_W+TAB_GAP),ty=tabY;
    const trashX=tx+TAB_W,trashY=ty;
    if(Math.hypot(mx-trashX,my-trashY)<=13){
      const wld=worlds[i];
      // clean up chat if the deleted world's animal was chatting
      if(activeChatAnimal&&wld.animals.some(a=>a.id===activeChatAnimal.id)){
        activeChatAnimal.chatting=false;activeChatAnimal=null;
        currentSpeech='';userSpeech='';speechBar.classList.add('hidden');
      }
      worlds.splice(i,1);
      if(pendingNewWorld&&pendingNewWorld.id===wld.id)pendingNewWorld=null;
      if(activeWorldId===wld.id){
        activeWorldId=worlds.length?worlds[Math.max(0,i-1)].id:null;
        currentSpeech='';userSpeech='';speechBar.classList.add('hidden');
      }
      return;
    }
  }

  if(my>=tabY){
    for(let i=0;i<worlds.length;i++){
      const tx=TAB_MARGIN+i*(TAB_W+TAB_GAP);
      if(mx>=tx&&mx<=tx+TAB_W){if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}activeWorldId=worlds[i].id;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');return;}
    }
    const bx=TAB_MARGIN+worlds.length*(TAB_W+TAB_GAP);
    if(mx>=bx&&mx<=bx+NEW_BTN_W){if(!pendingNewWorld){pendingNewWorld={id:worldIdCounter++,envId:null,envLabel:'New Group',animals:[]};worlds.push(pendingNewWorld);}if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}activeWorldId=pendingNewWorld.id;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');}
    return;
  }
  const world=getActiveWorld();if(!world)return;

  // Delete mode: confirm + remove hovered animal
  if(deleteMode){
    if(hoveredDeleteAnimal&&world.animals.some(a=>a.id===hoveredDeleteAnimal.id)){
      const name=hoveredDeleteAnimal.name,id=hoveredDeleteAnimal.id;
      if(confirm(`Are you sure you want to delete ${name}?`)){
        world.animals=world.animals.filter(a=>a.id!==id);
        if(activeChatAnimal&&activeChatAnimal.id===id){activeChatAnimal.chatting=false;activeChatAnimal=null;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');}
        hoveredDeleteAnimal=null;
      }
    }
    return; // Don't open chat while in delete mode
  }

  for(const a of world.animals){const dx=mx-a.x,dy=my-a.y;if(Math.sqrt(dx*dx+dy*dy)<42){openChat(a);return;}}
  if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;currentSpeech='';userSpeech='';speechBar.classList.add('hidden');}
});

// Delete-mode: track hovered animal
canvas.addEventListener('mousemove',e=>{
  if(!deleteMode){if(hoveredDeleteAnimal){hoveredDeleteAnimal=null;}return;}
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const world=getActiveWorld();
  hoveredDeleteAnimal=null;
  if(world){for(const a of world.animals){if(Math.hypot(mx-a.x,my-a.y)<48){hoveredDeleteAnimal=a;break;}}}
  canvas.style.cursor=hoveredDeleteAnimal?'pointer':'crosshair';
});
canvas.addEventListener('mouseleave',()=>{if(deleteMode)hoveredDeleteAnimal=null;});

// ════════════════════════════════════════
// CHAT

let spawnLimitTimer;

// ── Char limit warning ──
const charCountEl=document.getElementById('char-count');
const charWarningEl=document.getElementById('char-warning');
let charWarningTimer;
function showCharWarning(){
  charWarningEl.classList.add('show');
  clearTimeout(charWarningTimer);
  charWarningTimer=setTimeout(()=>charWarningEl.classList.remove('show'),2000);
}
function hideCharWarning(){
  charWarningEl.classList.remove('show');
  clearTimeout(charWarningTimer);
}
function updateCharCount(n){
  charCountEl.textContent=n+'/100';
  charCountEl.classList.toggle('at-limit',n>=100);
}

// ── Input handler (100 non-space char limit) ──
document.getElementById('chat-input').addEventListener('input',function(){
  const val=chatInput.value;
  const noSpaces=val.replace(/ /g,'');
  if(noSpaces.length>100){
    let kept=0,result='';
    for(const ch of val){
      if(ch===' '){result+=ch;}
      else{kept++;if(kept<=100)result+=ch;}
    }
    chatInput.value=result;
    showCharWarning();
    updateCharCount(100);
  } else if(noSpaces.length===100){
    showCharWarning();
    updateCharCount(100);
  } else {
    hideCharWarning();
    updateCharCount(noSpaces.length);
  }
});

// AUDIO SYSTEM — synthesised animal voices
// ════════════════════════════════════════
let audioCtx=null,masterGain=null,audioMuted=false,audioVolume=0.45;

function ensureAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=audioMuted?0:audioVolume;
  masterGain.connect(audioCtx.destination);
}
function setAudioMuted(muted){
  audioMuted=muted;
  if(!audioCtx){if(!muted)ensureAudio();return;}
  masterGain.gain.setTargetAtTime(muted?0:audioVolume,audioCtx.currentTime,.3);
}
function setAudioVolume(vol){
  audioVolume=vol;
  if(audioCtx&&!audioMuted)masterGain.gain.setTargetAtTime(vol,audioCtx.currentTime,.1);
}

// ── Low-level sound helpers ──
function _n(ot,f0,f1,dur,v,d){  // oscillator note
  if(!audioCtx||!masterGain)return;
  const T=audioCtx.currentTime+(d||0);
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type=ot;osc.frequency.setValueAtTime(f0,T);
  if(f1!==f0)osc.frequency.exponentialRampToValueAtTime(Math.max(f1,1),T+dur*.88);
  g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+Math.min(.02,dur*.15));
  g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  osc.connect(g);g.connect(masterGain);osc.start(T);osc.stop(T+dur+.05);
}
function _nb(f0,f1,dur,v,d){_n('sine',f0,f1,dur,v,d);}
function _ns(f0,f1,dur,v,d){_n('sawtooth',f0,f1,dur,v,d);}
function _sq(f0,f1,dur,v,d){_n('square',f0,f1,dur,v,d);}
function _noise(freq,q,dur,v,d){  // filtered noise burst
  if(!audioCtx||!masterGain)return;
  const T=audioCtx.currentTime+(d||0),sr=audioCtx.sampleRate;
  const len=Math.ceil(sr*(dur+.12));
  const buf=audioCtx.createBuffer(1,len,sr);
  const data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource();src.buffer=buf;
  const flt=audioCtx.createBiquadFilter();flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=q;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(.0001,T);g.gain.linearRampToValueAtTime(v,T+.015);
  g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  src.connect(flt);flt.connect(g);g.connect(masterGain);src.start(T);src.stop(T+dur+.05);
}

function playAnimalSound(name){
  if(!audioCtx||audioMuted||audioCtx.state==='suspended')return;
  const type=SOUND_TYPE[name];
  if(!type)return;
  const V=0.45;
  switch(type){
    case'chirp':  // small birds — 2-3 quick chirps
      [0,.13,.26].slice(0,2+Math.round(Math.random())).forEach(d=>
        _nb(2100+Math.random()*400,3500+Math.random()*500,.09,V*.5,d));
      break;
    case'squawk': // macaw/parrot/peacock — harsh double squawk
      _ns(680,360,.13,V*.62);_ns(880,480,.11,V*.52,.2);
      break;
    case'hoot':   // owl — two mellow hoots
      _nb(365,342,.42,V*.56);_nb(325,304,.4,V*.5,.58);
      break;
    case'caw':    // crow/vulture — 2-3 caws
      [0,.22,.44].slice(0,2+Math.round(Math.random())).forEach(d=>
        _ns(440,700,.16,V*.56,d));
      break;
    case'honk':   // swan/goose
      _ns(310,470,.4,V*.62);_ns(275,410,.34,V*.52,.5);
      break;
    case'buzz':   // bee — short flat buzz
      _sq(195,180,.34,V*.3);
      break;
    case'cricket':// cricket — rhythmic pulses
      for(let i=0;i<6;i++)_sq(4900,4900,.025,V*.36,i*.052);
      break;
    case'dolphin':// high whistle glide + echolocation clicks
      _nb(7200,14500,.22,V*.44);_nb(14000,5000,.28,V*.38,.25);
      [.56,.585,.61].forEach(d=>_nb(1500,900,.022,V*.36,d));
      break;
    case'whale':  // long low moan
      {const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
      osc.type='sine';osc.frequency.setValueAtTime(68,now);
      osc.frequency.exponentialRampToValueAtTime(185,now+.85);
      osc.frequency.exponentialRampToValueAtTime(52,now+2.2);
      g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(V*.52,now+.35);
      g.gain.exponentialRampToValueAtTime(.0001,now+2.2);
      osc.connect(g);g.connect(masterGain);osc.start(now);osc.stop(now+2.3);}
      break;
    case'seal':   // 2-3 barky woofs
      [0,.26,.5].slice(0,2+Math.round(Math.random())).forEach(d=>{
        _ns(470,200,.13,V*.58,d);_ns(330,180,.09,V*.44,d+.07);});
      break;
    case'roar':   // big cat / bear — rumbling roar
      _ns(78,145,.9,V*.54);_noise(210,1.8,.95,V*.44,.07);
      break;
    case'elephant':// trumpet — ascending screech
      _ns(195,700,.75,V*.64);_ns(370,230,.36,V*.5,.8);
      break;
    case'howl':   // wolf — long ascending howl
      {const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime;
      osc.type='sine';osc.frequency.setValueAtTime(162,now);
      osc.frequency.exponentialRampToValueAtTime(730,now+.62);
      osc.frequency.exponentialRampToValueAtTime(550,now+1.55);
      g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(V*.56,now+.18);
      g.gain.exponentialRampToValueAtTime(.0001,now+1.58);
      osc.connect(g);g.connect(masterGain);osc.start(now);osc.stop(now+1.65);}
      break;
    case'moo':    // cow
      _ns(118,195,.4,V*.56);_ns(195,98,.6,V*.52,.42);
      break;
    case'oink':   // pig
      _ns(490,270,.13,V*.54);_ns(440,245,.12,V*.48,.23);
      break;
    case'neigh':  // horse
      _ns(275,660,.38,V*.56);_ns(660,200,.33,V*.48,.4);
      break;
    case'baa':    // sheep — vibrato bleat
      {const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),
       vib=audioCtx.createOscillator(),vibG=audioCtx.createGain(),now=audioCtx.currentTime;
      osc.type='sine';osc.frequency.setValueAtTime(420,now);
      osc.frequency.exponentialRampToValueAtTime(352,now+.46);
      vib.frequency.value=6;vibG.gain.value=14;vib.connect(vibG);vibG.connect(osc.frequency);
      g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(V*.46,now+.06);
      g.gain.exponentialRampToValueAtTime(.0001,now+.48);
      osc.connect(g);g.connect(masterGain);osc.start(now);osc.stop(now+.52);
      vib.start(now);vib.stop(now+.52);}
      break;
    case'ribbit': // frog — two-tone ribbit
      _sq(1200,820,.09,V*.5);_sq(1000,720,.08,V*.46,.14);
      break;
    case'hiss':   // snake — noise burst
      _noise(5800,1.4,.46,V*.4);
      break;
    case'monkey': // monkey — descending chatter
      [0,.13,.26,.39].forEach((d,i)=>_ns(575-i*65,275-i*30,.09,V*.44,d));
      break;
    case'grunt':  // generic mammal grunt
      _ns(105,155,.2,V*.5);
      break;
    case'yip':    // fox/raccoon — double yip
      _ns(880,480,.09,V*.46);_ns(800,420,.08,V*.4,.17);
      break;
    case'chitter':// small mammals — rapid chattering
      [0,.07,.14,.21].forEach(d=>_sq(2100+Math.random()*400,2900,.046,V*.34,d));
      break;
    case'cluck':  // chicken/turkey
      _ns(640,295,.09,V*.5);_ns(475,240,.07,V*.4,.14);_nb(375,340,.14,V*.3,.26);
      break;
  }
}

function buildSystemPrompt(animal){
  return`You are a ${animal.name} living in the ${animal.envLabel}. Speak in first person, in character, as this animal would — knowledgeable about your own species, habitat, and behaviors.

STRICT RULES — no exceptions, every response:

1. NO ACTION/ROLEPLAY TEXT. Never write anything inside asterisks or brackets describing your physical actions — no *wags tail*, *roars*, *flaps wings*, *purrs*, *tilts head*, *nuzzles*, *sniffs*, [wagging tail], or anything like that. Speak only in words, like a real conversation.

2. INFORMATIVE & DETAILED. Give 2–4 sentences per reply. Include at least one real, accurate fact about ${animal.name} — diet, habitat, behavior, adaptation, lifespan, speed, etc. Be genuinely interesting and educational, suitable for curious kids and teens up to age 14.

3. IN CHARACTER. You ARE the animal. Refer to your own real-world instincts and abilities naturally. Don't say "as an animal" — just speak as yourself.

4. PHYSICAL LIMITS. If asked to do something a real ${animal.name} physically cannot do, decline naturally and pivot to something you actually can do. Example: "I can't do that — but I can [real ability]."

5. LANGUAGE. If anyone uses inappropriate language, respond only: "Let's keep this respectful."

6. NEVER break character, never acknowledge being an AI or a game.`;
}

async function openChat(animal){
  bubbleExpanded=false;moreButtonRect=null;
  activeChatAnimal=animal;animal.chatting=true;
  loadingEmoji.textContent=animal.emoji;
  loadingText.textContent=`Waking up ${animal.name}...`;
  loadingOverlay.classList.remove('hidden');
  if(conversations[animal.id]){loadingOverlay.classList.add('hidden');showChatUI(animal);return;}
  conversations[animal.id]=[];currentSpeech='';userSpeech='';
  try{
    const greeting=await callAPI(animal,[{role:'user',content:`Hi! Say a fun greeting as ${animal.name}!`}]);
    conversations[animal.id].push({role:'user',content:`Hi! Say a fun greeting as ${animal.name}!`},{role:'assistant',content:greeting});
    currentSpeech=greeting;loadingOverlay.classList.add('hidden');showChatUI(animal);
  }catch(err){loadingOverlay.classList.add('hidden');alert('Could not connect. Please try again.');animal.chatting=false;activeChatAnimal=null;}
}

function showChatUI(animal){speechBar.classList.remove('hidden');chatInput.focus();}

async function sendMessage(){
  if(!activeChatAnimal||isSending)return;
  const text=chatInput.value.trim();if(!text)return;
  chatInput.value='';updateCharCount(0);isSending=true;chatSend.disabled=true;
  bubbleExpanded=false;moreButtonRect=null;
  userSpeech=hasBadWord(text)?'[message filtered]':text;
  const userContent=hasBadWord(text)?'[message filtered]':text;
  conversations[activeChatAnimal.id].push({role:'user',content:userContent});
  try{
    const reply=await callAPI(activeChatAnimal,conversations[activeChatAnimal.id]);
    conversations[activeChatAnimal.id].push({role:'assistant',content:reply});currentSpeech=reply;
  }catch(e){
    const fb="Oops, I lost my voice! Try again? 🐾";
    conversations[activeChatAnimal.id].push({role:'assistant',content:fb});currentSpeech=fb;
  }
  isSending=false;chatSend.disabled=false;chatInput.focus();
}

async function callAPI(animal,messages){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemPrompt:buildSystemPrompt(animal),messages})});
  if(!res.ok)throw new Error('API error '+res.status);
  const data=await res.json();return data.reply;
}

chatSend.addEventListener('click',sendMessage);
chatInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
closeChatBtn.addEventListener('click',()=>{if(activeChatAnimal){activeChatAnimal.chatting=false;activeChatAnimal=null;}currentSpeech='';userSpeech='';bubbleExpanded=false;moreButtonRect=null;speechBar.classList.add('hidden');});

function selectEnv(id){
  activeEnv=id;
  document.querySelectorAll('.env-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  const env=environments.find(e=>e.id===id);
  document.getElementById('env-label').textContent=env.label+' Animals';
  const grid=document.getElementById('animals-grid');grid.innerHTML='';
  env.animals.forEach(animal=>{
    const card=document.createElement('div');card.className='animal-card';card.draggable=true;
    card.innerHTML=`<span class="emoji">${animal.emoji}</span><span class="name">${animal.name}</span>`;
    card.addEventListener('dragstart',e=>{
      dragPayload={emoji:animal.emoji,name:animal.name,envId:env.id,envLabel:env.label};
      card.classList.add('dragging');
      const dc=document.createElement('canvas');dc.width=90;dc.height=90;
      const dx=dc.getContext('2d');
      dx.beginPath();dx.arc(45,45,42,0,Math.PI*2);dx.fillStyle='#fff';dx.fill();
      dx.strokeStyle='#4a9e6b';dx.lineWidth=3;dx.stroke();
      dx.font='42px serif';dx.textAlign='center';dx.textBaseline='middle';
      dx.fillText(animal.emoji,45,45);
      e.dataTransfer.setDragImage(dc,45,45);
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    grid.appendChild(card);
  });
}

document.getElementById('clear-all-btn').addEventListener('click',()=>{
  // Clear animals from the world matching the panel's active environment
  const target=worlds.find(w=>w.envId===activeEnv);
  if(!target||target.animals.length===0)return;
  if(!confirm(`Clear all animals from the ${environments.find(e=>e.id===activeEnv)?.label||activeEnv} world?`))return;
  // Reset chat if any of those animals was active
  if(activeChatAnimal&&target.animals.some(a=>a.id===activeChatAnimal.id)){
    activeChatAnimal.chatting=false;activeChatAnimal=null;
    currentSpeech='';userSpeech='';speechBar.classList.add('hidden');
  }
  target.animals=[];
});
document.getElementById('delete-mode-btn').addEventListener('click',()=>setDeleteMode(!deleteMode));

const panel=document.getElementById('panel');
const toggleBtn=document.getElementById('toggle-btn');
let collapsed=false;
toggleBtn.addEventListener('click',()=>{
  collapsed=!collapsed;panel.classList.toggle('collapsed',collapsed);
  toggleBtn.classList.toggle('panel-collapsed',collapsed);
  toggleBtn.innerHTML=collapsed?'&#x276E;':'&#x276F;';
  setTimeout(resize,260);
});
</script>
</body>
